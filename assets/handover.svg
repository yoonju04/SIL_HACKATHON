<svg xmlns="http://www.w3.org/2000/svg" width="927" height="474" viewBox="0 0 927 474"><style>text{font-family:Arial,'Noto Sans',sans-serif;fill:#eaf2ff} .title{font-size:27px;font-weight:700} .heading{font-size:18px;font-weight:700} .detail{font-size:13px;fill:#a7bbd3} .line{stroke:#79addc;stroke-width:2;fill:none} .card{fill:#1b304a;stroke:#4f759b;stroke-width:1.4} .accent{fill:#145e69;stroke:#3dbbb5} .purple{fill:#453a6f;stroke:#8d77db}</style><rect width="100%" height="100%" rx="20" fill="#0c1728"/><text x="38" y="51" class="title">Controller Handover vs. Steering Hardware</text><text x="38" y="76" class="detail">MPC to LQR is a high-level algorithm handover; it is not physical actuator redundancy.</text><rect x="36" y="119" width="245" height="82" rx="11" class="card"/><text x="158.5" y="149" text-anchor="middle" class="heading">Primary MPC</text><text x="158.5" y="171" text-anchor="middle" class="detail">nominal lateral command</text><rect x="333" y="119" width="245" height="82" rx="11" class="purple"/><text x="455.5" y="149" text-anchor="middle" class="heading">Supervisor</text><text x="455.5" y="171" text-anchor="middle" class="detail">fault detection + arbitration</text><rect x="630" y="119" width="245" height="82" rx="11" class="accent"/><text x="752.5" y="149" text-anchor="middle" class="heading">Backup LQR</text><text x="752.5" y="171" text-anchor="middle" class="detail">fallback command</text><path d="M281 160 L333 160" class="line"/><circle cx="333" cy="160" r="4" fill="#79addc"/><path d="M630 160 L578 160" class="line"/><circle cx="578" cy="160" r="4" fill="#79addc"/><rect x="332" y="268" width="247" height="82" rx="11" class="card"/><text x="455.5" y="298" text-anchor="middle" class="heading">Applied steering</text><text x="455.5" y="320" text-anchor="middle" class="detail">to EPS or SbW actuator</text><path d="M455 201 L455 268" class="line"/><circle cx="455" cy="268" r="4" fill="#79addc"/><text x="43" y="406" class="heading">EPS with mechanical link</text><text x="43" y="434" class="detail">Wheel ↔ steering column ↔ road wheels; electronic assist/control when supported.</text><text x="557" y="406" class="heading">Steer-by-Wire</text><text x="557" y="434" class="detail">Wheel sensor → electronic ECU → road-wheel actuator; no direct column linkage.</text></svg>