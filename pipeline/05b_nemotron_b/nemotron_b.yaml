# nemotron_b.yaml — Nemotron B: 코드 질문 (결과 비참조)
# 입력: 01 safety profile 관측 + 시나리오 후보. 실패 사례·CARLA 결과·GP 예측은 보지 않는다.
# 출력: 질문 답변 one-hot → 06 GP surrogate

meta:
  schema_version: '1.0'
  profile_id: sp-code-aware-mpc-lqr
  status: template_unverified

nemotron:
  model: nvidia/Nemotron-3-Ultra-550b-a55b     # 호출 파라미터의 원본은 pipeline/llm_models.yaml roles.B (3회 다수결)
  # temperature: 여기 값(0.0)은 run.py가 읽지 않았다 (integration3 #7에서 제거). 유일한 원본 = pipeline/llm_models.yaml roles.B
  #   (실제 적용값 temperature 1.0, top_p 0.95; engine/llm.py role_settings)
  require_json_schema_validation: true

B_question_answering:
  inputs: [safety_profile.verified_observations, scenario_candidate]
  forbidden_inputs: [prior_failure_examples, carla_results, gp_predictions]
  scope: "코드를 읽어야만 답할 수 있는 질문만. 계산 가능한 것은 결정론적 feature로."
  # integration3 #6 (Nemotron B 재설계):
  #   scope: per_scenario = 후보마다 묻는다 (b_key 단위 캐시) / static = 캠페인마다 한 번 묻는다 (코드 고정 사실)
  #   gp_feature: true 인 질문만 GP 입력 one-hot 이 된다. static 질문은 항상 false (상수 feature는 GP에 정보가 없다)
  #   expected_from_code: 코드가 답을 정하는 경우의 정답. 문자열 / 허용 답 목록 / by_fault_mode 매핑
  #     (모드별 값은 문자열, 목록, 또는 {cases: [{when: {param, le|lt|ge|gt}, expect}], default})
  #     null = 코드가 정하지 않음 → 비교하지 않음. B 다수결 답과 비교해 matches_code / b_hallucination_rate 기록
  #   evidence_regions: 답을 정하는 코드 위치 (파일 + 함수 이름 또는 줄 범위). 인용 줄이 하나라도 여기 들어가야
  #     citations_relevant true
  #   param_bins: 답이 파라미터 구간에 따라 바뀌는 경우의 경계. b_key 에 구간 번호가 붙는다 (캐시 크기는 유한)
  #   줄번호는 2026-10-28 integration3 av_stack 기준 (pipeline/08_carla_paired_run/av_stack)
  #   주의: yes/no 는 반드시 따옴표. 따옴표가 없으면 YAML 이 true/false 로 읽는다 (예전 Q-B2/Q-B3 버그)
  question_bank:
    - id: Q-B1
      scope: per_scenario
      gp_feature: true                           # 고장 모드를 '차량에 무엇이 나가는가'로 묶어 준다 (fault one-hot 은 모두 같은 거리)
      question: "이 고장이 시작된 뒤 감독기가 전환하기 전까지 어떤 조향 명령이 차량에 나가는가?"
      question_en: "From the fault onset until the supervisor switches, which steering command reaches the vehicle?"
      answer: ['hold_last', 'zero', 'stale_mpc', 'corrupted_mpc', 'lqr_early', 'unknown']
      answer_notes:
        corrupted_mpc: "고장이 바꾼 MPC 조향값이 감지 전까지 그대로 나간다"
        stale_mpc: "몇 틱 전에 계산한 MPC 조향값이 나간다"
        lqr_early: "첫 고장 틱에 바로 감지되어 그 틱부터 LQR 조향이 나간다 (고장 값은 차량에 가지 않음)"
      refs: [S2]
      # jev-judge: 정답 키를 감독기 프로필별로 나눔 (by_supervisor). 예전 키는 legacy(속도 검사 없음) 기준이라 tight 에서 틀렸다.
      #   tight 의 속도 검사: |Δsteer|/dt > 90 °/s, 틱 0.05 s → 한 틱 4.5° = 0.0785 rad 넘게 뛰면 첫 고장 틱에 걸린다.
      #   bias / intermittent_bias 는 시작(켜짐) 순간 magnitude 만큼 뛴다 → > 0.0785 rad 이면 lqr_early.
      #   (MPC 자체가 그 틱에 최대 3° 움직이므로 0.0785 근처는 근사; param_bins 로 구간을 나눈다)
      #   saturate ramp_s 0 은 최대각×level(≥ 0.2 → ≥ 6°)로 한 틱에 뛴다 → lqr_early. ramp 가 있으면 level/ramp 에 따라 다름.
      param_bins: {magnitude_rad: [0.0785], ramp_s: [0.0]}
      expected_from_code:
        by_supervisor:
          tight:
            by_fault_mode:
              solver_fail: 'lqr_early'           # fault_injection.py ok=False → supervised_lateral.py inspect 첫 검사 → 같은 틱 LQR
              stale: 'lqr_early'                 # 직전 정상 출력(같은 seq) → stale_sequence
              bias:
                cases:
                  - {when: {param: magnitude_rad, gt: 0.0785}, expect: 'lqr_early'}   # 첫 틱 점프 > 4.5° → steer_rate_exceeded
                default: 'corrupted_mpc'
              drift: 'corrupted_mpc'             # 0.05 rad/s ≈ 0.14°/틱: 속도 검사 불가
              intermittent_bias:
                cases:
                  - {when: {param: magnitude_rad, gt: 0.0785}, expect: 'lqr_early'}
                default: 'corrupted_mpc'
              saturate:
                cases:
                  - {when: {param: ramp_s, le: 0.0}, expect: 'lqr_early'}             # 한 틱 점프 ≥ 6° > 4.5°
                default: ['lqr_early', 'corrupted_mpc']                              # level/ramp_s 에 따라 (코드가 하나로 정하지 않음)
              output_delay: 'stale_mpc'          # k틱 전 steer, 새 seq/stamp
          legacy:                                # 속도 검사 없음 (SupervisorConfig(1.0, 0.6, 0.25, None)) = 예전 정답 키
            by_fault_mode:
              solver_fail: 'lqr_early'
              stale: 'lqr_early'
              bias: 'corrupted_mpc'
              drift: 'corrupted_mpc'
              intermittent_bias: 'corrupted_mpc'
              saturate: 'corrupted_mpc'
              output_delay: 'stale_mpc'
      evidence_regions:
        - {file: integration/fault_injection.py, function: MPCFaultInjector}
        - {file: integration/supervised_lateral.py, function: MPCSupervisor.inspect}
        - {file: integration/supervised_lateral.py, function: SupervisedLateral.step}
    - id: Q-B4
      scope: per_scenario
      gp_feature: true                           # 유일하게 파라미터(saturate duration_s, ramp_s)에 따라 정답이 바뀌는 질문
      question: "이 고장 모드와 파라미터에서, 고장이 켜져 있는 동안 감독기의 어느 검사가 가장 먼저 걸리는가? (고장과 무관한 계산 시간 초과는 제외)"
      question_en: "For this fault mode and these parameters, which supervisor check fires first WHILE the fault is active? Ignore deadline misses caused by wall-clock compute time unrelated to the fault. Answer none_during_fault if no check can fire before the fault window ends."
      answer: ['solver_failure', 'missing_steer', 'nonfinite_output', 'steer_out_of_range', 'deadline_miss',
               'stale_output', 'stale_sequence', 'steer_rate_exceeded', 'tracking_divergence', 'controller_exception',
               'none_during_fault', 'unknown']
      refs: [S1, S2]
      # integration3 #8: 기대 답은 감독기 tight 프로파일 기준 (run_benchmark.py --supervisor 기본, paired_runs.yaml runner.supervisor).
      #   tight: tracking_divergence 0.6 m / 0.35 rad 0.15 s 유지 + MPC 명령 속도 > 90 °/s 즉시 (steer_rate_exceeded).
      #   expected answers are for the tight profile (default); legacy (1.0 m / 0.6 rad / 0.25 s, no rate check) differs.
      param_bins: {duration_s: [0.15], ramp_s: [0.0], magnitude_rad: [0.0785]}   # 지속 0.15 s / ramp 0 = 한 틱 점프 / bias 점프 > 4.5°
      expected_from_code:
       by_supervisor:
        tight:
         by_fault_mode:
          solver_fail: 'solver_failure'          # supervised_lateral.py MPCSupervisor.inspect 첫 검사 (ok = False)
          stale: 'stale_sequence'                # stamp 차 0.05 s ≤ 0.1 이라 stale_output 아님, seq 같음 → stale_sequence (속도 검사보다 앞)
          # 아래는 코드가 '불가능한 답'만 정하면 허용 답 목록 (어느 쪽이 먼저인지는 차량 동역학이 정함)
          # 속도 검사: |Δsteer| / dt > 90 °/s (0.05 s 틱이면 한 틱에 4.5° = 0.0785 rad). MPC 자체는 60 °/s(틱당 3°)로 제한
          bias:                                  # 시작 순간 magnitude 만큼 점프 (0.02~0.1 rad)
            cases:
              - {when: {param: magnitude_rad, gt: 0.0785}, expect: 'steer_rate_exceeded'}   # jev-judge: 점프 > 4.5° → 첫 틱
            default: ['steer_out_of_range', 'tracking_divergence', 'none_during_fault']
          drift: ['steer_out_of_range', 'tracking_divergence', 'none_during_fault']   # 0.05 rad/s ≈ 2.9 °/s + MPC 60 °/s < 90 °/s → 속도 검사 불가
          intermittent_bias:                     # 켜질/꺼질 때마다 점프 (0.05~0.15 rad)
            cases:
              - {when: {param: magnitude_rad, gt: 0.0785}, expect: 'steer_rate_exceeded'}
            default: ['steer_out_of_range', 'steer_rate_exceeded', 'tracking_divergence', 'none_during_fault']
          output_delay: ['steer_rate_exceeded', 'tracking_divergence', 'none_during_fault']    # 시작 순간 k틱 전 명령으로 되돌아감 (최대 k×3°)
          saturate:                              # target = level×최대각, level ≤ 1 → 최대각 '초과' 검사 통과
            cases:
              - {when: {param: ramp_s, le: 0.0}, expect: 'steer_rate_exceeded'}   # jev-judge: 한 틱 점프 ≥ 6° (level ≥ 0.2)
              - {when: {param: duration_s, le: 0.15}, expect: ['steer_rate_exceeded', 'none_during_fault']}   # 0.15 s 유지 조건을 고장 중에 못 채움
            default: ['steer_rate_exceeded', 'tracking_divergence', 'none_during_fault']
        legacy:                                  # 속도 검사 없음, 추적 발산 1.0 m / 0.6 rad 0.25 s 유지
         by_fault_mode:
          solver_fail: 'solver_failure'
          stale: 'stale_sequence'
          bias: ['steer_out_of_range', 'tracking_divergence', 'none_during_fault']
          drift: ['steer_out_of_range', 'tracking_divergence', 'none_during_fault']
          intermittent_bias: ['steer_out_of_range', 'tracking_divergence', 'none_during_fault']
          output_delay: ['tracking_divergence', 'none_during_fault']
          saturate:
            cases:
              - {when: {param: duration_s, le: 0.25}, expect: 'none_during_fault'}   # 0.25 s 유지 조건을 고장 중에 못 채움
            default: ['tracking_divergence', 'none_during_fault']
      evidence_regions:
        - {file: integration/supervised_lateral.py, function: MPCSupervisor.inspect}
        - {file: integration/fault_injection.py, function: MPCFaultInjector}
        - {file: integration/fault_injection.py, function: FaultConfig}
        - {file: mpc_controller/mpc.py, function: MPCLateralController.compute}
    - id: Q-B5
      scope: per_scenario
      gp_feature: false                          # 고장 모드만의 함수이고 Q-B1 과 거의 같은 분할 → 환각 검사용
      question: "이 고장은 감독기가 보는 MPC 출력의 어느 필드를 바꾸는가?"
      question_en: "Which fields of the MPC output that the supervisor inspects does this fault change?"
      answer: ['ok_flag', 'sequence_or_stamp', 'steer_value_only', 'steer_and_reported_state', 'none', 'unknown']
      refs: [S2]
      expected_from_code:
        by_fault_mode:
          solver_fail: 'ok_flag'                 # fault_injection.py:111
          stale: 'sequence_or_stamp'             # :112 직전 출력 전체 (seq·stamp 가 옛 값)
          bias: 'steer_value_only'               # :79-82
          drift: 'steer_value_only'
          intermittent_bias: 'steer_value_only'
          saturate: 'steer_value_only'           # :97
          output_delay: 'steer_and_reported_state'   # :101 state 도 옛 값 → 추적 오차 검사(supervised_lateral.py:75)도 k틱 늦게 봄
      evidence_regions:
        - {file: integration/fault_injection.py, function: MPCFaultInjector}
    - id: Q-B2
      scope: static
      gp_feature: false
      question: "복귀 로직이 반복 전환(MPC→LQR→MPC)을 허용하는가?"
      question_en: "Does the supervisor ever switch back from LQR to MPC, allowing repeated MPC<->LQR switching?"
      answer: ['yes', 'no', 'unknown']
      refs: [S3]
      expected_from_code: 'no'                   # supervised_lateral.py:130,147-148 active 는 mpc→lqr→safe_stop 만 (복귀 코드 없음)
      evidence_regions:
        - {file: integration/supervised_lateral.py, function: SupervisedLateral.step}
    - id: Q-B3
      scope: static                              # 고장·파라미터와 무관한 코드 사실 (전 결과 194/224 'no')
      gp_feature: false
      question: "전환 순간 LQR 상태 초기화가 조향 불연속을 만들 수 있는가?"
      question_en: "Can the LQR takeover at the switch instant create a steering discontinuity (a jump larger than the post-takeover rate limit)?"
      answer: ['yes', 'no', 'unknown']
      refs: [S1]
      expected_from_code: 'no'                   # lqr.py:158-174 내부 적분 상태 없음, supervised_lateral.py:165-167 직전 적용 조향 기준 60°/s 제한
      evidence_regions:
        - {file: integration/supervised_lateral.py, function: SupervisedLateral.step}
        - {file: lqr_controller/lqr.py, function: LQRLateralController.compute}
  call_once_per: b_key                       # per_scenario: fault_mode|onset_event(+param_bins 구간). static: 캠페인당 한 번
  unknown_is_not_false: true                 # 'unknown' 은 환각으로 세지 않는다 (matches_code false, hallucinated false)
  logprobs_are_not_failure_probabilities: true

feedback_in: none                            # 결과 피드백을 받지 않는다

# ---- 2026-10-27: run.py ----
code_context:                                   # B가 읽는 파일 (av_stack 기준 상대경로, 줄번호 붙여 전체 전달)
  files:
    - integration/supervised_lateral.py
    - integration/fault_injection.py
    - integration/pdm_agent.py
    - lqr_controller/lqr.py
    - mpc_controller/mpc.py                     # integration3 #6: seq 증가(:205)·조향 clamp(:246) 근거
  citation_check: file_and_line_in_range        # 인용 줄이 파일 범위 밖이면 citations_valid false
  citation_relevance: evidence_regions          # integration3 #6: 인용 줄 하나 이상이 질문의 evidence_regions 안 → citations_relevant
repeats: 3                                      # llm_models.yaml roles.B.repeats
