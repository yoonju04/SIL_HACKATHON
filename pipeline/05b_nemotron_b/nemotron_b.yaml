# nemotron_b.yaml — Nemotron B: 코드 질문 (결과 비참조)
# 입력: 01 safety profile 관측 + 시나리오 후보. 실패 사례·CARLA 결과·GP 예측은 보지 않는다.
# 출력: 질문 답변 one-hot → 06 GP surrogate

meta:
  schema_version: '1.0'
  profile_id: sp-code-aware-mpc-lqr
  status: template_unverified

nemotron:
  model: nvidia/Nemotron-3-Ultra-550b-a55b     # 호출 파라미터의 원본은 pipeline/llm_models.yaml roles.B (3회 다수결)
  temperature: 0.0
  require_json_schema_validation: true

B_question_answering:
  inputs: [safety_profile.verified_observations, scenario_candidate]
  forbidden_inputs: [prior_failure_examples, carla_results, gp_predictions]
  scope: "코드를 읽어야만 답할 수 있는 질문만. 계산 가능한 것은 결정론적 feature로."
  question_bank:
    - id: Q-B1
      question: "이 고장 동안 감지 지연 구간에 어떤 조향 명령이 나가는가?"
      question_en: "During the detection-delay interval of this fault, which steering command reaches the vehicle?"
      answer: [hold_last, zero, stale_mpc, lqr_early, unknown]
      refs: [S2]                                 # 2026-10-27: H-02 → S2
      expected_from_code: null                   # 고장 모드마다 다름 (fault_injection.py) → B 답과 비교하지 않음
    - id: Q-B2
      question: "복귀 로직이 이 고장 패턴에서 반복 전환을 허용하는가?"
      question_en: "Does the switch-back logic allow repeated MPC<->LQR switching for this fault pattern?"
      answer: [yes, no, unknown]
      refs: [S3]                                 # H-03 → R(재설계)/S3
      expected_from_code: 'no'                   # supervised_lateral.py 래치(한 번 전환하면 복귀 없음). B 답이 다르면 환각 신호
    - id: Q-B3
      question: "전환 순간 LQR 상태 초기화가 조향 불연속을 만들 수 있는가?"
      question_en: "Can the LQR state initialisation at the switch instant create a steering discontinuity?"
      answer: [yes, no, unknown]
      refs: [S1]                                 # H-02/H-03/H-05 → S1
      expected_from_code: null
  call_once_per: seed_scenario               # 섭동 후보는 시드의 답변 재사용
  unknown_is_not_false: true
  logprobs_are_not_failure_probabilities: true

feedback_in: none                            # 결과 피드백을 받지 않는다

# ---- 2026-10-27: run.py ----
code_context:                                   # B가 읽는 파일 (av_stack 기준 상대경로, 줄번호 붙여 전체 전달)
  files:
    - integration/supervised_lateral.py
    - integration/fault_injection.py
    - integration/pdm_agent.py
    - lqr_controller/lqr.py
  citation_check: file_and_line_in_range        # 인용 줄이 파일 범위 밖이면 citations_valid false
repeats: 3                                      # llm_models.yaml roles.B.repeats
