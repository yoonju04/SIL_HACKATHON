# surrogate.yaml — GP surrogate (지표별 GP)
# 입력: 05a 결정론적 feature + 05b 판정자 답 (laya/jev: 회귀 확률 연속값, 상수 열 제외 | nemotron: one-hot) (+ ODD·고장 수치)
# 타깃: 가설마다 주 지표가 다르므로 지표마다 GP를 하나씩 둔다.
#       지표 목록·타깃 형태·스케일의 원본은 02 vulnerability_patterns.yaml metric_rules[*].gp
# 출력: 지표별 평균·불확실성(정규화 z) → 07 Orchestrator

meta:
  schema_version: '2.0'
  profile_id: sp-code-aware-mpc-lqr
  status: template_unverified

surrogate:
  model: gaussian_process_regression
  backend: sklearn                              # engine/surrogate.py (GaussianProcessRegressor, normalize_y)
  min_train_points: 4                           # 지표별 학습점이 이보다 적으면 GP 없음 → 무작위 몫
  min_train_runs_for_acquisition: 8             # integration3: 학습 런(이력 포함)이 이보다 적으면 GP 선택 대신 space filling
  kernel: "Matern 5/2 with ARD + WhiteKernel"
  # integration3: feature는 모두 [0,1] (engine/scenarios.py numeric_features) → 학습 데이터 min/max로 다시 늘리지 않음.
  # 예전엔 점 몇 개로 min/max 정규화 + 길이척도 [1e-2, 1e2] 라서 길이척도가 경계에 붙고 예측이 상수가 됐다
  # (result_2 R01-0007/0008 gp_mean 8자리까지 같음).
  kernel_bounds: {length_scale_init: 0.5, length_scale_bounds: [0.1, 10.0], constant_bounds: [0.05, 20.0],
                  noise_init: 0.01, noise_bounds: [0.0001, 0.5], n_restarts: 3}
  prior_mean: level                             # integration3: level_set 지표 GP의 사전 평균 = 경계값 h (데이터 없는 곳 = "모름/경계").
                                                #   training_mean = 예전 normalize_y (실패 위주로 뽑힌 학습 평균이 미탐색 영역을 '실패'로 예측)
  switch_model: classifier                      # integration3: switched_indicator = GP 분류 (P(switch) ∈ [0,1]). regression = 예전 ±1 회귀
  history: "run.py --gp-history 'result/*/run_records.jsonl' : 이전 캠페인 런을 GP 학습에 합침 (라벨은 그대로)"
  per_metric: true                              # 지표 하나당 GP 하나, 같은 feature 입력
  targets_from: 02_hypotheses/vulnerability_patterns.yaml#metric_rules.*.gp
  active_metrics: metrics_of_hypotheses_with_status [proposed, testing]   # blocked 가설 지표는 학습 안 함
  train_on: all_valid_runs_where_target_defined # 모든 런이 모든 지표를 기록하므로 지표 GP끼리 데이터 공유

  # 타깃 계산 (런 1개 → 지표별 y 1개)
  target_forms:
    paired_delta_if_fault_else_absolute:
      with_fault: "metric(fault_injected) - metric(no_fault_baseline)"   # 같은 match 키의 baseline
      without_fault: "metric(run)"               # H-08/H-10/H-11처럼 fault_types가 빈 후보는 짝 없음
    absolute_post_switch:
      value: "metric(fault_injected)"           # 전환 후 창만 정의됨. baseline은 전환이 없다
      undefined_if: no_switch                   # 타깃 없음으로 제외, recovery_success=false는 판정에서만 사용

  # 지표끼리 단위가 달라 07에서 한 줄로 순위를 매기려면 방향·스케일을 맞춘다
  orientation:
    formula: "z = sign * y / gp.scale"
    sign: "+1 if support_direction == negative else -1"   # 결과: z가 낮을수록 가설 방향(더 위험)
    scale_units: "metric_rules[*].gp.scale (= minimum_effect, lane_recovery_robustness 0.1 example_only, lat_acc_excess_mps2 0.5 provisional)"
    fit_on: z                                   # GP는 z를 학습한다. 원래 단위 평균은 z * scale / sign으로 복원
  target_transform:
    fraction_metrics: none                      # deadline_miss_rate 등. 0/1 근처에 몰리면 logit 검토
  outputs: [mean_z, std_z]                      # 지표별
  refit: per_batch
  # 2026-10-27: 전환 후 복구 GP 타깃을 둘로 분리 (02 outcome_definitions)
  #   lane_recovery_robustness (metric_rules.recovery_success.gp) — 차선 여유만, 충돌은 -1.0 (provisional)
  #   lat_acc_excess_mps2 (metric_rules.lat_acc_excess_mps2.gp) — 같은 경로 위치 baseline 대비 |Δa_y| 최대값
  #   둘 다 absolute_post_switch: 전환 없는 런은 타깃 없음. 판정용 이진 라벨(final_safe_recovery)은 GP에 넣지 않는다
  not_used_for_hypothesis_decision: true        # 판정은 02 decision_protocol의 전용 무작위 런만

# 09 Monitor → GP 재학습
feedback_in:
  from: 09_monitor/run_record
  select: all_valid_runs
  fields: [features, metrics, baseline_metrics, gp_targets]
