# video_explainer.yaml — 10 영상 해설 (Cosmos Reason / Nemotron VL). 판정관이 아니라 해설자
# 입력: 09 monitor가 이미 판정한 런의 영상(front.mp4 또는 view.mp4) + 모니터 이벤트 타임라인
# 출력: explanations.jsonl (런별 해설 JSON + 검증 결과). run_record·안전 라벨은 절대 바꾸지 않는다
# 검증을 통과한 해설만 피드백(03 A few-shot, 06 범주형 feature, 메커니즘 분류표)에 쓴다

meta:
  schema_version: '1.0'
  status: provisional
  never_sets_safety_labels: true

select_runs:                            # 어떤 런을 해설할지
  failed: true                          # 전환했고 final_safe_recovery == false, 또는 전환 없이 P-01 < 0 / P-03 위반
  boundary_near_abs_robustness: 0.15    # |lane_recovery_robustness| < 0.15 (PROVISIONAL)
  max_per_round: 4                      # 비용 상한

clip:
  source_preference: [front.mp4, view.mp4]   # front.mp4는 front_frames.jsonl 시각이 있어 정확. view.mp4는 틱 순서로 근사
  before_switch_s: 2.0
  after_switch_s: 6.0
  no_switch_anchor: first_departure_or_fault_onset   # 전환이 없는 실패 런의 기준 시각
  fps: 4                                # Cosmos 학습 설정과 같은 4 FPS
  max_height_px: 720
  timestamp_overlay: bottom             # 프레임 하단에 시뮬레이션 시각 t=..s (Cosmos가 하단 타임스탬프를 읽음)
  contact_sheet: {fps: 2, columns: 4, tile_width_px: 320}   # 요청당 이미지 1장 제한 대비 (Super-VL 서버 예시 설정)

verification:
  time_tolerance_s: 0.5                 # 주장한 사건 시각과 모니터 로그 차이 허용치 (configurable)
  check: [switch_time_s, departure_time_s, evidence_frames_s_in_clip, tags_in_taxonomy]
  accept_rule: all_checkable_claims_pass
  hallucination_metric: rejected / explained

mechanism_taxonomy:                     # 해설이 고를 수 있는 태그. 없는 패턴은 novel_tags로
  - pre_switch_lateral_drift            # 전환 전에 이미 한쪽으로 쏠림
  - departed_before_switch              # 전환 순간 이미 차선 밖
  - curve_entry_during_handover         # 커브 진입·통과 중 전환
  - steering_angle_saturation           # 조향각 한계에 걸림
  - steering_rate_limit                 # 조향 속도 한계로 따라가지 못함
  - overshoot_after_switch              # 복귀하며 반대쪽으로 넘어감
  - oscillation_after_switch            # 전환 뒤 좌우 흔들림
  - late_detection                      # 고장이 오래 감지되지 않음
  - collision_after_departure           # 이탈 후 충돌
  - stable_recovery                     # 문제 없이 복귀 (경계 근처 성공 런 설명용)

feedback:
  few_shot_to_A: {k: 5, only_accepted: true}
  gp_categorical_features: {enabled: true, context_key: [route_id, onset_event], smoothing_alpha: 1.0}
  taxonomy_builder: {min_cluster_size: 2, output: monitor_rule_candidates.yaml, auto_apply: false}
  counterfactual_queue: {enabled: true, max_per_round: 2}

prompt:
  # 역할 분리: 해설기는 '맥락'(고장·트리거·전환 시각)만 받고, 영상에서 봐야 하는 값(차선 이탈·충돌·오프셋·포화·최종 판정)은 숨긴다.
  # verify()는 숨긴 monitor 값과 비교하므로 프롬프트를 베껴서는 통과할 수 없다. (pipeline/engine/explainer.py VISIBLE_TIMELINE_KEYS)
  visible_timeline_keys: [fault_mode, fault_magnitude, planned_fault_onset_s, actual_fault_onset_s,
                          trigger_time_s, trigger_source, switch_time_s]
