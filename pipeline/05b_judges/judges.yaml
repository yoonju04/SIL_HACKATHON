# judges.yaml — 05b B 판정자 (laya-judge 브랜치 기본): System One 판정자 25개 병렬 + 질문별 회귀
# 05b B judge (default on the laya-judge branch): 25 typed judges per state in ONE /v1/systemone request, combined per
# original question by a regression fit to the code-derived answer key (Quantitative LLM Judges, arXiv 2506.02945).
#
# 백엔드 (orchestrator.yaml judge_b / run.py --judge-b):
#   laya (기본) — 오픈소스 Laya (Apache-2.0, github.com/NandhaKishorM/laya, HF convaiinnovations/laya). 로컬 laya-serve 가
#                 TypeSafe Jev 와 같은 POST /v1/systemone 프로토콜·답 스키마를 낸다. 키 필요 없음.
#   jev         — TypeSafe 호스팅 Jev (TYPESAFE_API_KEY, 선택). 같은 클라이언트, base_url 과 키만 다르다.
#   nemotron    — Token Factory Nemotron 을 System One 처럼 쓴다 (같은 질문 25개, 보기별 확률 JSON). NEBIUS_API_KEY
#   nemotron_b  — 예전 Nemotron B (생성 + 인용, 옛 질문 은행 Q-B1~5, 05b_nemotron_b/nemotron_b.yaml). 비교용
#
# 질문 원본은 하나: 05b_judges/questions.yaml (J1~J9). 여기에는 질문을 복사하지 않고, 질문마다 판정자(변형) 이름만 적는다.
# engine/judges.py 가 질문 은행에서 판정 질문을 만든다. 계산 가능한 것은 질문하지 않고 05a DF-07~09 로 GP 에 넣는다.
# The question text has ONE source (questions.yaml); this file only lists judge variants per question id.
#
# 독립성 규칙: state 에는 코드 발췌 + 시나리오(고장 모드·파라미터·시작 이벤트) + 감독기 프로필 설정만 넣는다.
#   expected_from_code 정답, 런 결과, 실패 사례, GP 예측은 절대 넣지 않는다 (정답은 회귀 학습 라벨로만 쓴다).
# Independence: the state never carries expected_from_code, run outcomes, failure examples or GP predictions.

meta:
  schema_version: '2.0'                         # v2: 질문 은행 J1~J9 (questions.yaml), 숫자 질문은 DF-07~09 로
  status: offline_checked_on_result_8           # docs/JUDGES.md: Nemotron 82 상태, Laya 15 상태. 호스팅 Jev 는 키로 미검증

backends:
  laya:
    # laya-serve (pip install "laya[serve]"; LAYA_HOST=127.0.0.1 LAYA_DEVICE=cpu LAYA_MODELS=multilingual laya-serve)
    base_url: http://127.0.0.1:8000             # env LAYA_BASE_URL 이 덮어씀
    base_url_env: LAYA_BASE_URL
    path: /v1/systemone
    api_key_env: LAYA_API_KEY                   # 선택: laya-serve 에 LAYA_API_KEY 를 걸었을 때만
    key_required: false
    inprocess_fallback: true                    # 서버가 없고 이 파이썬에 laya 가 깔려 있으면 laya.Router 를 직접 쓴다
    model: multilingual                         # mmBERT-base 322M. english(ModernBERT-large) 는 문맥 512 토큰이라 코드 state 가 잘린다
    max_len: 2048                               # 요청 본문 control (Router.predict max_len). 실측 state ≈ 1.1k 토큰 (docs/JUDGES.md)
    head_max_len: 256                           # 보기 토큰 예산 (multilingual 기본 256; 우리 보기는 최대 12개라 충분)
    state_view: compact                         # 감독기 판정 줄 + 해당 고장 모드 줄만 (아래 state.compact)
    timeout_s: 300                              # CPU 추론: 25 질문 × 최대 2048 토큰
    max_retries: 2
    price_per_mtok_usd: 0.0                     # 로컬
  nemotron:
    # System One 흉내: 한 요청 = state + 질문 25개, 모델이 질문마다 보기별 확률을 JSON 으로 낸다 (json_schema 강제).
    role: B                                     # pipeline/llm_models.yaml roles.B (모델·thinking·max_tokens). NEBIUS_API_KEY
    state_view: full
    temperature: 0.6
    max_tokens: 16000
    parallel: 6                                 # 오프라인 평가·라운드 안에서 동시 요청 수
    price_per_mtok_usd: 0.0                     # Token Factory 단가는 llm_models.yaml 밖 (보고서는 토큰 수만)
  jev:
    # docs.typesafe.ai (2026-10-29 확인): POST https://api.typesafe.ai/v1/systemone, Authorization: Bearer <key>,
    # body {model, state, questions: {name: {type: choice|noul|score, instructions, criteria}}},
    # response {model, answers: {name: {type, choice, confidence, probabilities} | {type, noul}}, usage: {input_tokens, output_tokens}}
    base_url: https://api.typesafe.ai
    path: /v1/systemone
    api_key_env: TYPESAFE_API_KEY               # 없으면 결정론적 stub (SYNTHETIC) 으로 돈다
    key_required: true
    model: jev-1.14.0                           # 버전 고정 (jev-latest alias 는 움직인다). 벤치마크 논문은 jev-1.13.0
    state_view: full                            # 64k 문맥: 함수 전체 발췌
    timeout_s: 30
    max_retries: 3                              # 429 / 529 / 5xx 만 재시도 (retry-after 따름)
    price_per_mtok_usd: 0.042                   # 입력 토큰만 과금
    long_context: false                         # true 면 TypeSafe-Danger-Zone-Long-Context 헤더 (64k → 262k)

state:
  tick_s: 0.05                                  # 단위 변환만 (rad → deg). 비교·계산 결과는 넣지 않는다
  full:                                         # jev: Nemotron B 가 읽던 파일의 해당 함수 전체
    max_chars_per_view: 9000
    code_views:
      supervisor:
        - {file: integration/supervised_lateral.py, function: SupervisorConfig}
        - {file: integration/supervised_lateral.py, function: MPCSupervisor.inspect}
      fault_injection:
        - {file: integration/fault_injection.py, function: FaultConfig}
        - {file: integration/fault_injection.py, function: MPCFaultInjector}
      switch:
        - {file: integration/supervised_lateral.py, function: SupervisedLateral.step}
      mpc:
        - {file: mpc_controller/mpc.py, function: MPCLateralController.compute}
      lqr:
        - {file: lqr_controller/lqr.py, function: LQRLateralController.compute}
  compact:                                      # laya: 문맥이 짧아 (1024~2048) 판정에 필요한 줄만. 주석·docstring·빈 줄 제거
    # 뺀 것 (docs/JUDGES.md): SupervisorConfig 본문 (값은 scenario.supervisor_profile 에 있음), FaultConfig 검증,
    # 다른 고장 모드의 주입 코드, SupervisedLateral.step 의 LQR 무효·safe_stop 분기, MPC/LQR compute 전체
    code_views:
      supervisor:
        - {file: integration/supervised_lateral.py, function: MPCSupervisor.inspect}
      fault_injection:
        - {file: integration/fault_injection.py, function: MPCFaultInjector.apply, grep: ["'{fault_mode}'", "config.active", "return result"]}
        - {file: integration/fault_injection.py, function: "MPCFaultInjector.{fault_helper}"}
      switch:
        - {file: integration/supervised_lateral.py, function: SupervisedLateral.step,
           grep: ["if self.active == ", "self.mpc.compute", "injector.apply", "monitor.inspect", "if self.reason is not None", "self.active = ", "step_controller\\('lqr'", "limit = ", "np.clip", "self.last = result"]}
    fault_helpers: {bias: _shift, drift: _shift, intermittent_bias: _intermittent, saturate: _saturate, output_delay: _delayed}
    max_chars_per_view: 2500

judges:                                         # 질문 → 판정자 변형. J3 은 applies_to (intermittent_bias, saturate) 일 때만 → 22~25개
  J1: [en_notes, en_notes_rev, ko, focus_supervisor]          # 감지 경로
  J3: [en_notes, en_notes_rev, focus_supervisor]              # on/off 고장의 유지 시간 회피
  J4: [en_notes, en_notes_rev, focus_switch_rev]              # 전환 전 차량에 나가는 조향 (옛 Q-B1)
  J7: [en_notes, en_notes_rev, focus_switch_rev]              # 전환 순간 연속성 (옛 Q-B3 를 시나리오별로)
  J8: [en_notes, focus_fault]                                 # 고장이 LQR 경로까지 가는가 (보고만)
  J9: [en_notes, focus_switch_rev]                            # 복귀 허용 (옛 Q-B2, 보고만)
  J2: [en_notes, en_notes_rev, focus_supervisor]              # 감지 지연 구간 (라벨 = 실제 결과)
  J5: [en_notes, en_notes_rev, ko]                            # 감지 전 차선 이탈 위험 (라벨 = 실제 결과)
  J6: [en_notes, focus_switch_rev]                            # LQR 첫 명령 속도 제한 (라벨 = 실제 결과)

variants:                                       # form: choice | noul. focus = 지시문이 가리키는 state 필드
  en_notes:         {form: choice, lang: en, order: forward, focus: [scenario, code]}
  en_notes_rev:     {form: choice, lang: en, order: reverse, focus: [scenario, code]}   # 보기 순서 편향 확인 (jaggedness #8)
  ko:               {form: choice, lang: ko, order: forward, focus: [scenario, code]}
  focus_fault:      {form: choice, lang: en, order: forward, focus: [scenario, code.fault_injection, code.switch]}
  focus_supervisor: {form: choice, lang: en, order: reverse, focus: [scenario, code.supervisor]}
  focus_switch_rev: {form: choice, lang: en, order: reverse, focus: [scenario, code.switch, code.supervisor]}

key:                                            # 판정 캐시 키 = 고장 모드|시작 이벤트|질문 param_bins 구간|속도 구간|경로
  speed_bins_kmh: [20, 35]                      # 결과 라벨 질문(J2·J5·J6)은 속도·도로에 따라 다르므로 키에 넣는다
  include_route: true

regression:                                     # 원래 질문마다 판정자 확률 → 정답 키 (Quantitative LLM Judges)
  method: multinomial_logistic_l2               # 입력 = 판정자별 log p (보기마다), L2 정규화
  C: 0.5
  prob_clip: 0.001
  cv_folds: 5                                   # 층화 k-fold, 라벨 적으면 줄임. 보고 지표는 모두 out-of-fold
  min_labels: 8                                 # 정답이 하나로 정해진 state 수가 이보다 적으면 단순 평균
  min_classes: 2
  blend_mean: 0.1                               # 최종 = 0.9 회귀 + 0.1 판정자 평균 (학습에 없던 보기도 0이 아니게)
  low_confidence: 0.5                           # (K·pmax−1)/(K−1) < 0.5 → low_confidence 표시
  ece_bins: 10

proposals:                                      # B 시나리오 제안: J1 이 사각지대·편차 누적이라 본 상태 근처의 위험 후보 (source B)
  enabled: true
  per_round: 2                                  # 라운드당 최대 개수 (04 gate 로 scenario space 검사)
  min_prob: 0.4                                 # p(no_dedicated_check) + p(deviation_accumulation) 하한
  below_rate_check_frac: 0.9                    # bias/intermittent: 크기를 속도 검사 한 틱 (0.0785 rad) 의 이 비율로
  speed_step_kmh: 5.0
gp_features:
  questions_from_bank: gp_feature               # 질문 은행의 gp_feature true (J1 J3 J4 J7 J2 J5 J6) 만 GP 입력
  encoding: probability                         # 보기별 회귀 확률 (one-hot 대신 연속값)
  drop_constant: true                           # 캐시된 모든 state 에서 값이 안 변하는 열은 뺀다
  constant_tol: 1.0e-6
