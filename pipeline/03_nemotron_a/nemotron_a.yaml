# nemotron_a.yaml — Nemotron A: 시나리오 생성
# 입력: 01 safety profile 관측, 02 가설, scenario_space, 이전 실패 사례(few-shot)
# 출력: 시나리오 후보 + 근거 → 04 타당성 검사
# 실패 사례는 A만 본다 (B는 결과 비참조).

meta:
  schema_version: '1.0'
  profile_id: sp-code-aware-mpc-lqr
  status: template_unverified

nemotron:
  model: nvidia/Nemotron-3_5-Lightning         # 호출 파라미터의 원본은 pipeline/llm_models.yaml roles.A
  temperature: 0.7
  require_json_schema_validation: true

A_scenario_generation:
  inputs: [safety_profile.verified_observations, hypotheses, scenario_space,
           prior_failure_examples]
  outputs:
    candidate: [scenario_id, route_id, environment, fault, onset_event,
                onset_offset_s, hypothesis_ids]
    rationale: [evidence_ids, expected_mechanism, missing_information]
  per_round: 15
  must_cite_ids: true
  cite_only_hypotheses_with_status: [proposed, testing]   # 07이 hypothesis_ids로 지표 GP를 고른다
  objective_ids: [S1]                           # 2026-10-27: H-xx 대신 S-set objective id를 인용

# 09 Monitor → A 피드백 (실패 few-shot)
feedback_in:
  from: 09_monitor/error_table
  select: verified_failures_top_k               # 09 error_table failure_table 규칙: unrecovered 우선, 라벨(recovery_labels) 포함
  k: 5

# ---- 2026-10-27: run.py ----
include_unreviewed_observations: true           # 사용자 결정 필요: verified:false 관측을 'unreviewed leads'로 A에 준다 (false면 제외)
refine:
  enabled: true                                 # 라운드마다 GP 경계 근처 3개를 A_refine(thinking ON)으로 다듬기
  max_candidates: 3
video_feedback:                                 # 10 video explainer 검증 통과 해설만
  few_shot_mechanism: true                      # prior_failures_top_k[].verified_video_mechanism
  mechanism_summary: true                       # verified_video_mechanisms
surrogate_summary:                              # integration3 #4 (ChatScene arXiv 2405.14062, LeGEND arXiv 2409.10066:
  k: 6                                          #   LLM은 방향 제안, GP/탐색이 정밀화). 매 라운드 A 입력에 GP 요약을 넣는다:
                                                #   boundary_regions (모호도 상위 k개: 1.96*std - |mean| 또는 P(switch)≈0.5),
                                                #   recent_outcomes_by_fault_mode (고장별 복구/실패 분포). round_XX/03_gp_summary.json
prompt_goal: boundary                           # "실패 찾기" → "성공/실패 경계 근처 제안". 범위 끝(5% 이내)은 extreme_justification 필요
