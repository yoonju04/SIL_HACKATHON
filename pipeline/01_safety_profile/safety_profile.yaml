# safety_profile.yaml — 코드 관측 사실만 담는다 (가설·탐색 공간·실험 설정은 다른 파일)
# 값이 없으면 null. 모든 관측값은 code_evidence.observations에 근거를 남기고,
# 각 섹션의 code_refs에는 관측 id(O-xxx)만 적는다.
# 추론(설계 가정)은 hypotheses.yaml로 이동했다.
#
# 2026-10-27: junwoo/sim-eval (commit 9b51151) av_stack 코드에서 근거가 분명한 값만 채웠다.
#   경로 접두어 AV = pipeline/08_carla_paired_run/av_stack/ (sim-eval 브랜치)
#   대상 구성: run_benchmark.py --controller supervised --planner pdm (PDM-Lite 경로,
#   scenario_space_av_stack.yaml의 관측 조건). 다른 planner 경로는 LQR 설정이 다르다(O-016 note).
#   모든 관측은 verified: false (에이전트가 코드를 읽어 추출, 사람 확인 전).

meta:
  schema_version: '1.0'
  profile_id: sp-code-aware-mpc-lqr
  status: partially_filled_from_code
  source_revision:
    repository: yoonju04/SIL_HACKATHON
    branch: junwoo/sim-eval
    commit: 9b5115168f832cea0cb018711f9fc60e0d9faa9b
    source_files:
      - AV/integration/supervised_lateral.py
      - AV/integration/fault_injection.py
      - AV/integration/pdm_agent.py
      - AV/integration/carla_io.py
      - AV/integration/monitor_logs.py
      - AV/mpc_controller/mpc.py
      - AV/mpc_controller/model.py
      - AV/mpc_controller/qp.py
      - AV/lqr_controller/lqr.py
      - AV/run_benchmark.py
      - AV/SUPERVISOR.md
  extraction_methods: [ast, static, llm_inference, human, simulation_measured]
  verification_states: [unverified, code_checked]   # 코드 사실은 code_checked까지만

system:
  controller_period_ms: 50               # O-001. required_for: [H-10]
  ego_vehicle_blueprint: null            # Bench2Drive 경로가 정함. 코드에서 고정값 못 찾음
  longitudinal_controller: null          # planner 따라 다름(PDM-Lite 페달 / PI). 고정 아님
  lateral_controller_chain: [C-MPC, SWITCH, C-LQR]

controllers:
  mpc:
    # 1. MPC 구현과 실패 처리 방식을 확인하기 위한 사실
    id: C-MPC
    implementation:
      file: AV/mpc_controller/mpc.py
      class_or_function: MPCLateralController
      prediction_model: dynamic_bicycle   # O-002. kinematic 아님 (H-08/H-11 applies_if는 false)
      model_parameters_fixed: true        # O-003. 런 시작 시 CARLA에서 한 번 읽고 고정
      assumed_friction: null              # O-004. 마찰 파라미터 없음(선형 cornering stiffness만)
      assumed_mass_kg: null               # 런타임에 CARLA physics_control.mass (O-003)
      state_variables: [e_y, e_y_dot, e_psi, e_psi_dot]   # O-002
      control_variables: [front_road_wheel_angle_rad]     # O-002
      solver_name: admm_osqp_algorithm    # O-005
      solver_interface: AV/mpc_controller/qp.py ADMMQP
    planning:
      horizon_steps: 50                   # O-006
      prediction_dt_s: 0.1                # O-006
      reference_inputs: [reference_path, speed_profile, curvature]
      cost_terms: [lateral_error, heading_error, steering_input, lateral_jerk, steer_rate, terminal]
      cost_weights: {w_lat_error: 1.0, w_heading_error: 0.0, w_heading_error_squared_vel: 0.3,
                     w_steering_input: 1.0, w_steering_input_squared_vel: 0.25, w_lat_jerk: 0.1,
                     w_steer_rate: 0.0, w_terminal_lat_error: 1.0, w_terminal_heading_error: 0.1}  # O-006
    constraints:
      state_bounds: {}
      steering_angle_bounds: null         # 런타임 CARLA 앞바퀴 max_steer_angle (O-007). 고정 상수 아님
      steering_rate_bounds: 60.0          # deg/s. O-008
      acceleration_bounds: null
      lateral_accel_limit_mps2: null      # O-009. MPC에 횡가속도 제약 없음. required_for: [H-11]
      other_constraints: []
    solver_runtime:
      configured_time_limit_ms: 50        # O-010. 감독기 deadline(dt*1000). 솔버 자체 시간 제한은 없음
      maximum_iterations: 4000            # O-005
      convergence_tolerance: 1.0e-6       # O-005 (eps_abs = eps_rel)
      possible_status_codes: [solved, max_iter, unconstrained, 'error:<msg>']   # O-005
      timeout_handling: post_call_wall_time_check_switch_to_lqr   # O-010
      infeasible_handling: status_error_sets_ok_false_supervisor_switches   # O-011
      numerical_error_handling: exception_caught_returns_ok_false            # O-011
      warm_start_enabled: null
      last_valid_command_fallback: null   # MPC 자체 fallback 없음, 감독기가 LQR로 전환 (O-012)
    code_refs: [O-002, O-003, O-004, O-005, O-006, O-007, O-008, O-009, O-010, O-011]

  lqr:
    # 2. LQR 자체의 구현 및 동작 가정을 확인하기 위한 사실
    id: C-LQR
    implementation:
      file: AV/lqr_controller/lqr.py
      class_or_function: LQRLateralController
      design_model: dynamic_bicycle_error_model_discrete_bilinear   # O-013
      state_variables: [e_y, e_y_dot, e_psi, e_psi_dot]
      control_variables: [front_road_wheel_angle_rad]
      system_matrix_A_source: continuous_matrices(VehicleParams, v)   # O-013
      input_matrix_B_source: continuous_matrices(VehicleParams, v)
    feedback_design:
      gain_type: gain_scheduled           # O-014. 속도 0.25 m/s 단위로 Riccati 재계산. fixed 아님. required_for: [H-01]
      gain_K_source: online_riccati_per_speed_key   # O-014
      Q_source: 'pdm_agent LQR_CONFIG q=(0.5, 0.0, 1.0, 0.0)'   # O-016
      R_source: 'LQRConfig r=1.0'                               # O-016
      design_speed_mps: null              # O-014: 속도별 gain이라 단일 설계 속도 없음 (not_applicable). required_for: [DF-01, H-01]
      design_curvature_per_m: null        # O-015: 곡률은 feed-forward로 처리, 설계 곡률 없음 (not_applicable). required_for: [DF-02, H-01]
      scheduling_variables: [speed_mps]   # O-014
      feedforward_present: true           # O-015 (preview 0.2 s, O-016)
    constraints_and_behavior:
      steering_saturation: null           # 런타임 CARLA max_steer_angle (O-007). 조향각 한계(rad). required_for: [H-04, H-05, recovery_robustness]
      steering_rate_limit: 90.0           # deg/s, 전환 후. O-017. required_for: [H-05, recovery_robustness]
      output_clipping: true               # O-018. required_for: [H-05]
      state_estimate_inputs: [x, y, yaw, vx, vy, yaw_rate]   # O-019
      low_speed_handling: clamp_speed_min_2.0_mps           # O-018
      integrator_or_state_reset: none_stateless             # O-019 (gain 캐시만 보유)
      failure_or_invalid_output_handling: latch_safe_stop_full_brake_hold_last_steer   # O-020
    code_refs: [O-013, O-014, O-015, O-016, O-017, O-018, O-019, O-020]

switching:
  # 3. MPC→LQR 및 필요 시 LQR→MPC 전환 규칙
  supervisor_file: AV/integration/supervised_lateral.py
  backup_controller_enabled: true        # O-021 (--controller supervised일 때). required_for: [H-04, H-05, H-07, H-09]
  failure_detector_inputs:               # O-022. 주입 플래그는 보지 않음
    - mpc_output.ok
    - mpc_output.steer
    - mpc_output_finiteness(steer, s, kappa, stamp_s, state)
    - max_steer_rad
    - elapsed_wall_time_ms
    - mpc_output.stamp_s
    - mpc_output.seq
    - mpc_reported_state.e_y
    - mpc_reported_state.e_psi
  triggers:                              # O-023 (MPCSupervisor.inspect 순서대로, 첫 해당 항목이 reason)
    - id: T-01
      name: solver_failure
      condition: 'not output.ok'
      threshold: null
      consecutive_cycles: 1
      evidence_ids: [O-023]
    - id: T-02
      name: missing_steer
      condition: 'output.steer is None'
      threshold: null
      consecutive_cycles: 1
      evidence_ids: [O-023]
    - id: T-03
      name: nonfinite_output
      condition: 'any non-finite in (steer, s, kappa, stamp_s, *state)'
      threshold: null
      consecutive_cycles: 1
      evidence_ids: [O-023]
    - id: T-04
      name: steer_out_of_range
      condition: 'abs(steer) > max_steer + 1e-6'
      threshold: max_steer_rad
      consecutive_cycles: 1
      evidence_ids: [O-023]
      note: 'MPC 출력은 이미 lim으로 clip되므로(O-007) 자연 발생은 사실상 불가'
    - id: T-05
      name: deadline_miss
      condition: 'elapsed_ms > deadline_ms (호출 반환 후 wall-clock으로 검사)'
      threshold: 50          # ms = dt * 1000
      consecutive_cycles: 1
      evidence_ids: [O-010, O-023]
      note: 'wall-clock 기준이라 머신 부하에 따라 달라짐 (재현성 주의)'
    - id: T-06
      name: stale_output
      condition: 'abs(t - output.stamp_s) > 0.1'
      threshold: 0.1         # s
      consecutive_cycles: 1
      evidence_ids: [O-023]
    - id: T-07
      name: stale_sequence
      condition: 'output.seq <= last_seq'
      threshold: null
      consecutive_cycles: 1
      evidence_ids: [O-023]
    - id: T-08
      name: tracking_divergence
      condition: 'abs(e_y) > 1.0 or abs(e_psi) > 0.6, 0.25 s 이상 연속 (정상 샘플 하나면 타이머 리셋)'
      threshold: {e_y_m: 1.0, e_psi_rad: 0.6, hold_s: 0.25}
      consecutive_cycles: null   # 시간 기준 0.25 s (50 ms 주기면 약 5틱)
      evidence_ids: [O-023]
      note: 'MPC가 보고한 오차(output.state, 계획 경로 기준)를 씀'
    - id: T-09
      name: controller_exception
      condition: 'RuntimeError/ValueError/FloatingPointError/LinAlgError raised in MPC compute or injector'
      threshold: null
      consecutive_cycles: 1
      evidence_ids: [O-024]
  failure_detection_period_ms: 50        # O-021: 매 제어 주기 검사. required_for: [DF-04, H-02, H-06]
  switch_latency_ms: 0                   # O-021: 감지한 같은 루프 반복에서 LQR 명령. required_for: [H-06]
  command_during_detection_delay: null   # 즉시 검사(T-01~07, T-09)는 지연 없음. T-08 hold 0.25 s 동안은 MPC 명령이 그대로 적용됨(O-023). hold_last 아님. required_for: [H-02]
  handover:
    state_source_for_lqr: same_carla_state_each_tick   # O-019
    steering_blending: rate_limited_from_last_applied_steer   # O-017
    steering_rate_limit: 90.0            # deg/s, O-017
    reset_behavior: none_stateless       # O-019
  return_to_mpc:
    enabled: false                       # O-021: latch, 새 런까지 MPC로 돌아가지 않음. required_for: [H-03]
    conditions: []
    hysteresis: null
    minimum_dwell_s: null                # required_for: [H-03]
  code_refs: [O-010, O-017, O-019, O-021, O-022, O-023, O-024]

dependencies:
  # Input timing and stale-data handling can affect both controllers.
  # 지연·주기는 CARLA에서 측정되면 extraction_method: simulation_measured로 기록
  localization:
    update_rate_hz: null
    latency_ms: null
    stale_data_policy: null
  reference_path:
    update_rate_hz: null
    latency_ms: null
    stale_data_policy: null
  vehicle_state_estimator:
    update_rate_hz: null
    stale_data_policy: null
  other_inputs: []

vehicle:
  # 차선·차체 치수. 코드 또는 CARLA 맵/블루프린트에서 확인
  lane_half_width_m: null                # O-025: 런타임 waypoint.lane_width/2 (구간마다 다름). required_for: [H-11, recovery_robustness]
  vehicle_half_width_m: null             # O-025: 런타임 bounding_box.extent.y. required_for: [H-11, recovery_robustness]

recoverability:
  # 코드 사실이 아니라 LQR 설계 모델로 계산한 산출물. 계산 커밋과 함께 기록하고,
  # 비어 있으면 H-04/H-06/H-07/H-09는 blocked (02 recoverability_oracle_spec 참조)
  P_matrix: null
  level_c: null
  reach_table: null
  settling_time_s: null
  artifact_commit: null

code_evidence:
  # 관측 사실의 유일한 원본. 위 필드들은 여기의 id를 참조한다.
  # source.file은 sim-eval 브랜치의 저장소 루트 기준 경로.
  observations:
    - id: O-001
      field: system.controller_period_ms
      observed_value: 50
      source: {file: pipeline/08_carla_paired_run/av_stack/run_benchmark.py, line_start: 105, line_end: 105, symbol: 'dt=0.05', commit: 9b51151}
      extraction_method: static
      verified: false
      note: 'pdm_agent.py:125 self.dt = options.get("dt", .05); SUPERVISOR.md:13 "50ms default is the 20Hz control period"'
    - id: O-002
      field: controllers.mpc.implementation.prediction_model
      observed_value: dynamic_bicycle
      source: {file: pipeline/08_carla_paired_run/av_stack/mpc_controller/model.py, line_start: 1, line_end: 8, symbol: 'Dynamic bicycle error model', commit: 9b51151}
      extraction_method: static
      verified: false
      note: 'mpc.py:29 "Only the dynamics vehicle model is implemented"; state x=[e_y,e_y_dot,e_psi,e_psi_dot], u=front road-wheel angle (model.py:7)'
    - id: O-003
      field: controllers.mpc.implementation.model_parameters_fixed
      observed_value: true
      source: {file: pipeline/08_carla_paired_run/av_stack/integration/carla_io.py, line_start: 34, line_end: 72, symbol: vehicle_geometry, commit: 9b51151}
      extraction_method: static
      verified: false
      note: 'mass/lf/lr/max_steer는 CARLA physics_control에서 읽고 cf/cr는 기본값(1.2e5/1.4e5)을 질량 비율로 스케일. pdm_agent.py:224에서 런 시작 시 한 번 생성, VehicleParams는 frozen dataclass(model.py:29)'
      note_en: "mass/lf/lr/max_steer are read from CARLA physics_control; cf/cr are the defaults (1.2e5/1.4e5) scaled by mass. Built once at run start (pdm_agent.py:226); VehicleParams is a frozen dataclass (model.py:29)"  # integration3 #7: English for the Nemotron A prompt; line refs re-checked 2026-10-28
    - id: O-004
      field: controllers.mpc.implementation.assumed_friction
      observed_value: not_modeled
      source: {file: pipeline/08_carla_paired_run/av_stack/mpc_controller/model.py, line_start: 29, line_end: 37, symbol: VehicleParams, commit: 9b51151}
      extraction_method: static
      verified: false
      note: '마찰 계수 필드 없음. 선형 cornering stiffness cf/cr만 사용. 그래서 field는 null'
      note_en: "No friction coefficient field; only linear cornering stiffness cf/cr. Hence the field is null"  # integration3 #7: English for the Nemotron A prompt; line refs re-checked 2026-10-28
    - id: O-005
      field: controllers.mpc.solver_runtime.maximum_iterations
      observed_value: 4000
      source: {file: pipeline/08_carla_paired_run/av_stack/mpc_controller/qp.py, line_start: 36, line_end: 47, symbol: QPSettings, commit: 9b51151}
      extraction_method: static
      verified: false
      note: 'eps_abs=eps_rel=1e-6, status "solved"|"max_iter"|"error:<msg>"; mpc.py:79 qp_solver="admm", mpc.py:225 "unconstrained". max_iter는 ok=True (mpc.py:239 ok = not status.startswith("error"))라 전환 트리거가 아님'
      note_en: "eps_abs=eps_rel=1e-6, status 'solved'|'max_iter'|'error:<msg>'; default qp_solver='admm'. max_iter keeps ok=True (mpc.py:238 ok = not status.startswith('error')), so it is not a switch trigger"  # integration3 #7: English for the Nemotron A prompt; line refs re-checked 2026-10-28
    - id: O-006
      field: controllers.mpc.planning.horizon_steps
      observed_value: {horizon: 50, prediction_dt_s: 0.1}
      source: {file: pipeline/08_carla_paired_run/av_stack/mpc_controller/mpc.py, line_start: 59, line_end: 71, symbol: MPCConfig, commit: 9b51151}
      extraction_method: static
      verified: false
      note: 'cost_weights도 같은 줄'
      note_en: "cost weights are defined on the same lines"  # integration3 #7
    - id: O-007
      field: controllers.mpc.constraints.steering_angle_bounds
      observed_value: runtime_carla_front_wheel_max_steer_angle
      source: {file: pipeline/08_carla_paired_run/av_stack/integration/carla_io.py, line_start: 48, line_end: 49, symbol: max_steer, commit: 9b51151}
      extraction_method: static
      verified: false
      note: '기본값 radians(30) (carla_io.py:44). MPC는 mpc.py:218 lim=max_steer_rad, mpc.py:247에서 출력 clip. 차종마다 달라 상수로 채우지 않음'
      note_en: "default radians(30) (carla_io.py:44). MPC: lim = max_steer_rad (mpc.py:218), output clipped (mpc.py:246). Differs per vehicle, so no constant"  # integration3 #7: English for the Nemotron A prompt; line refs re-checked 2026-10-28
    - id: O-008
      field: controllers.mpc.constraints.steering_rate_bounds
      observed_value: 60.0 deg/s
      source: {file: pipeline/08_carla_paired_run/av_stack/mpc_controller/mpc.py, line_start: 73, line_end: 73, symbol: steer_rate_lim_dps, commit: 9b51151}
      extraction_method: static
      verified: false
      note: null
    - id: O-009
      field: controllers.mpc.constraints.lateral_accel_limit_mps2
      observed_value: not_present
      source: {file: pipeline/08_carla_paired_run/av_stack/mpc_controller/mpc.py, line_start: 22, line_end: 25, symbol: 'Constraints (Autoware)', commit: 9b51151}
      extraction_method: static
      verified: false
      note: '제약은 조향각·조향속도뿐. 그래서 field는 null'
      note_en: "Only steering angle and steering-rate constraints. Hence the field is null"  # integration3 #7: English for the Nemotron A prompt; line refs re-checked 2026-10-28
    - id: O-010
      field: controllers.mpc.solver_runtime.configured_time_limit_ms
      observed_value: 50
      source: {file: pipeline/08_carla_paired_run/av_stack/integration/supervised_lateral.py, line_start: 74, line_end: 74, symbol: 'MPCSupervisor(..., deadline_ms=dt * 1000)', commit: 9b51151}
      extraction_method: static
      verified: false
      note: '감독기 deadline. 검사는 호출 반환 후 (supervised_lateral.py:38-39, 102; SUPERVISOR.md:13-14 "not a process watchdog"). 솔버 자체 time limit은 없음'
      note_en: "Supervisor deadline, checked after the call returns (supervised_lateral.py:38-39, 100-105; SUPERVISOR.md:13-14 'not a process watchdog'). The solver has no time limit of its own"  # integration3 #7: English for the Nemotron A prompt; line refs re-checked 2026-10-28
    - id: O-011
      field: controllers.mpc.solver_runtime.infeasible_handling
      observed_value: status_error_sets_ok_false
      source: {file: pipeline/08_carla_paired_run/av_stack/mpc_controller/mpc.py, line_start: 239, line_end: 243, symbol: compute, commit: 9b51151}
      extraction_method: static
      verified: false
      note: '예외는 잡아서 ok=False, status="error:<type>"로 반환'
      note_en: "Exceptions are caught and returned as ok=False, status='error:<type>'"  # integration3 #7: English for the Nemotron A prompt; line refs re-checked 2026-10-28
    - id: O-012
      field: controllers.mpc.solver_runtime.last_valid_command_fallback
      observed_value: none_in_mpc
      source: {file: pipeline/08_carla_paired_run/av_stack/integration/supervised_lateral.py, line_start: 113, line_end: 117, symbol: step, commit: 9b51151}
      extraction_method: static
      verified: false
      note: 'reason이 있으면 같은 반복에서 LQR로 전환'
      note_en: "If the supervisor returns a reason, LQR takes over in the same iteration"  # integration3 #7: English for the Nemotron A prompt; line refs re-checked 2026-10-28
    - id: O-013
      field: controllers.lqr.implementation.design_model
      observed_value: dynamic_bicycle_error_model_discrete_bilinear
      source: {file: pipeline/08_carla_paired_run/av_stack/lqr_controller/lqr.py, line_start: 11, line_end: 20, symbol: module docstring, commit: 9b51151}
      extraction_method: static
      verified: false
      note: 'continuous_matrices lqr.py:88-100, discretize_apollo lqr.py:103-106'
    - id: O-014
      field: controllers.lqr.feedback_design.gain_type
      observed_value: gain_scheduled
      source: {file: pipeline/08_carla_paired_run/av_stack/lqr_controller/lqr.py, line_start: 140, line_end: 148, symbol: gain, commit: 9b51151}
