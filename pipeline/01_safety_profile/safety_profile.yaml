# safety_profile.yaml — 코드 관측 사실만 담는다 (가설·탐색 공간·실험 설정은 다른 파일)
# 값이 없으면 null. 모든 관측값은 code_evidence.observations에 근거를 남기고,
# 각 섹션의 code_refs에는 관측 id(O-xxx)만 적는다.
# 추론(설계 가정)은 hypotheses.yaml로 이동했다.

meta:
  schema_version: '1.0'
  profile_id: sp-code-aware-mpc-lqr
  status: template_unverified
  source_revision: {repository: null, commit: null, source_files: []}
  extraction_methods: [ast, static, llm_inference, human, simulation_measured]
  verification_states: [unverified, code_checked]   # 코드 사실은 code_checked까지만

system:
  controller_period_ms: null             # required_for: [H-10]
  ego_vehicle_blueprint: null
  longitudinal_controller: null
  lateral_controller_chain: [C-MPC, SWITCH, C-LQR]

controllers:
  mpc:
    # 1. MPC 구현과 실패 처리 방식을 확인하기 위한 사실
    id: C-MPC
    implementation:
      file: null
      class_or_function: null
      prediction_model: null              # kinematic/dynamic bicycle, etc. required_for: [H-08, H-11]
      model_parameters_fixed: null        # 질량·마찰 등 모델 파라미터가 고정인가. required_for: [H-08]
      assumed_friction: null              # 예측 모델이 가정하는 마찰. required_for: [H-09]
      assumed_mass_kg: null
      state_variables: []
      control_variables: []
      solver_name: null
      solver_interface: null
    planning:
      horizon_steps: null
      prediction_dt_s: null
      reference_inputs: []                # reference path, target speed, curvature, etc.
      cost_terms: []                      # tracking, steering, smoothness, etc.
      cost_weights: {}                    # actual weights only if extractable
    constraints:
      state_bounds: {}
      steering_angle_bounds: null         # required_for: [H-11]
      steering_rate_bounds: null
      acceleration_bounds: null
      lateral_accel_limit_mps2: null      # required_for: [H-11]
      other_constraints: []
    solver_runtime:
      configured_time_limit_ms: null      # required_for: [DF-03, H-03]
      maximum_iterations: null
      convergence_tolerance: null
      possible_status_codes: []
      timeout_handling: null              # required_for: [H-10]
      infeasible_handling: null
      numerical_error_handling: null
      warm_start_enabled: null
      last_valid_command_fallback: null
    code_refs: []

  lqr:
    # 2. LQR 자체의 구현 및 동작 가정을 확인하기 위한 사실
    id: C-LQR
    implementation:
      file: null
      class_or_function: null
      design_model: null                  # kinematic/dynamic, continuous/discrete
      state_variables: []
      control_variables: []
      system_matrix_A_source: null
      input_matrix_B_source: null
    feedback_design:
      gain_type: null                     # fixed / gain_scheduled / online; don't assume. required_for: [H-01]
      gain_K_source: null                 # hardcoded / file / online solver
      Q_source: null
      R_source: null
      design_speed_mps: null              # required_for: [DF-01, H-01]
      design_curvature_per_m: null        # required_for: [DF-02, H-01]
      scheduling_variables: []
      feedforward_present: null
    constraints_and_behavior:
      steering_saturation: null           # 조향각 한계(rad). required_for: [H-04, H-05, recovery_robustness]
      steering_rate_limit: null           # 조향속도 한계(rad/s). required_for: [H-05, recovery_robustness]
      output_clipping: null               # 명령을 한계로 자르는가. required_for: [H-05]
      state_estimate_inputs: []
      low_speed_handling: null
      integrator_or_state_reset: null
      failure_or_invalid_output_handling: null
    code_refs: []

switching:
  # 3. MPC→LQR 및 필요 시 LQR→MPC 전환 규칙
  supervisor_file: null
  backup_controller_enabled: null        # required_for: [H-04, H-05, H-07, H-09]
  failure_detector_inputs: []            # only runtime-observable signals (never injected-fault truth)
  triggers: []
  # 항목 형태:
  # - id: T-01
  #   condition: null                    # e.g. solver_wall_time > deadline
  #   threshold: null
  #   consecutive_cycles: null
  #   evidence_ids: []                   # O-xxx
  failure_detection_period_ms: null      # required_for: [DF-04, H-02, H-06]
  switch_latency_ms: null                # 감지 후 LQR 명령이 나가기까지. required_for: [H-06]
  command_during_detection_delay: null   # required_for: [H-02]
  handover:
    state_source_for_lqr: null
    steering_blending: null
    steering_rate_limit: null
    reset_behavior: null
  return_to_mpc:
    enabled: null                        # required_for: [H-03]
    conditions: []
    hysteresis: null
    minimum_dwell_s: null                # required_for: [H-03]
  code_refs: []

dependencies:
  # Input timing and stale-data handling can affect both controllers.
  # 지연·주기는 CARLA에서 측정되면 extraction_method: simulation_measured로 기록
  localization:
    update_rate_hz: null
    latency_ms: null
    stale_data_policy: null
  reference_path:
    update_rate_hz: null
    latency_ms: null
    stale_data_policy: null
  vehicle_state_estimator:
    update_rate_hz: null
    stale_data_policy: null
  other_inputs: []

vehicle:
  # 차선·차체 치수. 코드 또는 CARLA 맵/블루프린트에서 확인
  lane_half_width_m: null                # required_for: [H-11, recovery_robustness]
  vehicle_half_width_m: null             # required_for: [H-11, recovery_robustness]

recoverability:
  # 코드 사실이 아니라 LQR 설계 모델로 계산한 산출물. 계산 커밋과 함께 기록하고,
  # 비어 있으면 H-04/H-06/H-07/H-09는 blocked (02 recoverability_oracle_spec 참조)
  P_matrix: null
  level_c: null
  reach_table: null
  settling_time_s: null
  artifact_commit: null

code_evidence:
  # 관측 사실의 유일한 원본. 위 필드들은 여기의 id를 참조한다.
  # - id: O-001
  #   field: controllers.lqr.feedback_design.gain_type
  #   observed_value: fixed
  #   source: {file: control/lqr.py, line_start: 20, line_end: 24, symbol: K, commit: abc123}
  #   extraction_method: static
  #   verified: false
  #   note: null
  observations: []
  unresolved_questions: []
  conflicts: []                          # 값 충돌 시 verified 금지
