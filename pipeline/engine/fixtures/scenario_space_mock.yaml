# scenario_space_mock.yaml — SYNTHETIC FIXTURE (mock 모드 전용). 실측 아님.
# 구조와 범위는 junwoo/sim-eval 9b51151 pipeline/04_feasibility_expansion/scenario_space_av_stack.yaml 에서 복사했고
# observations(실측 결과)는 지웠다. sim-eval 병합 후에는 이 파일 대신 원본을 읽는다 (pipeline/engine/config.py).
meta:
  schema_version: '1.2'
  profile_id: sp-av-stack-pdm-supervised
  status: SYNTHETIC_FIXTURE_FOR_MOCK_MODE
  synthetic_fixture: true
  observation_sources: {}
supervisor:
  period_s: 0.05
  instant_checks:
  - solver_failure
  - missing_steer
  - nonfinite_output
  - steer_out_of_range
  - deadline_miss
  - stale_output
  - stale_sequence
  stale_output_tolerance_s: 0.1
  steer_out_of_range: 최대각 초과만 검사 (정확히 최대각은 통과)
  tracking_divergence:
    e_y_m: 1.0
    e_psi_rad: 0.6
    hold_s: 0.25
    note: MPC가 보고한 오차를 씀. 정상 샘플 하나면 타이머 리셋
  latched: true
environment:
  max_speed_kmh:
    range:
    - 10
    - 40
    unit: km/h
    cli: --max-speed
  tire_friction_scale:
    range:
    - 0.3
    - 1.0
    cli: null
    note: run_benchmark 미지원. 추가 전까지 1.0으로 실행
fault_timing:
  onset_event:
    values:
    - straight
    - curve_entry
    - curve_apex
    - curve_exit
  offset_s:
    range:
    - -1.0
    - 1.0
    unit: s
faults:
- id: F-01
  name: solver_fail
  group: control
  role: 명시적 계산 실패
  description: MPC가 '답을 못 구했다'고 보고
  check: 실패 상태를 받으면 정상 전환하는가
  layer: mpc_output
  injector_mode: solver_fail
  implemented: true
  params:
    duration_s:
      range:
      - 0.1
      - 3.0
      unit: s
  next_question: 커브 정점·고속에서 전환 직후 조향 점프와 회복 거리는 얼마인가
- id: F-02
  name: stale
  group: control
  role: 오래된 메시지
  description: 직전 메시지를 값·시각·번호까지 통째로 반복 (freshness 단서가 남는 경우)
  check: 출력 중단을 제때 감지하는가
  layer: mpc_output
  injector_mode: stale
  implemented: true
  params:
    duration_s:
      range:
      - 0.1
      - 3.0
      unit: s
  next_question: 값만 고정하고 시각·번호를 갱신하면 감지되는가 (확장 E-01)
- id: F-03
  name: output_delay
  group: risk
  role: 시간 문제
  description: k틱 전에 계산한 명령을 현재 시각·번호로 내보냄 (처리 지연. 옛 시각이면 시작 순간 번호 검사에 걸림)
  check: 늦은 명령 처리와 전환 지연
  layer: mpc_output
  injector_mode: output_delay
  implemented: true
  params:
    delay_ticks:
      values:
      - 1
      - 2
      - 3
      - 4
      - 6
  next_question: 몇 틱부터 전환이 늦어지고 충돌로 이어지는가. 속도와 곡률에 따라 경계가 어떻게 바뀌는가
- id: F-04
  name: bias
  group: risk
  role: 은밀한 값 오염
  description: 조향값에 일정한 각도를 계속 더함
  check: 감지 누락과 전환 후 회복
  layer: mpc_output
  injector_mode: bias
  implemented: true
  params:
    magnitude_rad:
      range:
      - 0.02
      - 0.1
      unit: rad
  next_question: 감지 경계 크기는 어디인가. 주입 방향(커브 안쪽/바깥쪽)에 따라 달라지는가
- id: F-05
  name: drift
  group: risk
  role: 점진적 값 오염
  description: 조향 오차가 시간이 갈수록 커짐
  check: 악화 속도에 따른 감지·전환 지연
  layer: mpc_output
  injector_mode: drift
  implemented: true
  params:
    rate_rad_s:
      range:
      - 0.005
      - 0.05
      unit: rad/s
  next_question: 악화 속도와 전환 지연은 어떤 관계인가
- id: F-06
  name: saturate
  group: risk
  role: 급격한 이상
  description: 조향을 정확히 최대각에 고정 (범위 검사 통과)
  check: 급격히 악화된 상태에서의 인계·회복
  layer: mpc_output
  injector_mode: saturate
  implemented: true
  params:
    duration_s:
      range:
      - 0.1
      - 1.0
      unit: s
    side:
      values:
      - positive
      - negative
      note: MPC 조향 부호
  next_question: 몇 초 고정부터 전환해도 차선 안에서 회복하지 못하는가
- id: F-07
  name: intermittent_bias
  group: risk
  role: 감독기 취약점
  description: bias를 간헐·주기적으로 켜고 끔
  check: 타이머 리셋으로 인한 전환 누락
  layer: mpc_output
  injector_mode: intermittent_bias
  implemented: true
  params:
    magnitude_rad:
      range:
      - 0.05
      - 0.15
      unit: rad
    on_s:
      range:
      - 0.1
      - 1.0
      unit: s
    off_s:
      range:
      - 0.05
      - 1.0
      unit: s
  next_question: 꺼짐 시간을 늘리면 타이머 리셋이 생기는가, 아니면 평균 bias가 줄어든 효과뿐인가
extensions:
- id: E-01
  name: header_refresh_replay
  description: 값은 고정, 시각·번호는 갱신 (정상 메시지처럼 보임)
- id: E-02
  name: localization_offset
  description: 제어기가 받는 차량 위치를 옆으로 틀리게 줌. LQR도 같이 오염되므로 MPC 단독 고장과 분리
- id: E-03
  name: covert
  description: 조향 오염 + 감독기에 보고하는 오차 위조. 감독기가 쓰는 정보의 출처에 따라 시험 의미가 달라짐
- id: E-04
  name: scale
  description: 조향 × k. 첫 버전은 bias·drift에 탐색 집중
- id: E-05
  name: threshold_dither
  description: 횡오차를 1 m 경계 근처에서 오르내리게 유도 (F-07 후속)
