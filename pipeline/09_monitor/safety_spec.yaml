# safety_spec.yaml — 안전 명세 P-01~03 (라벨 정의). 09 Monitor의 측면 입력

meta:
  schema_version: '1.0'
  profile_id: sp-code-aware-mpc-lqr
  status: template_unverified

safety_specification:
  properties:
    - id: P-01
      description: "차선 경계 유지"
      robustness: "min_over_window(signed_lane_boundary_margin_m)"
      failure_if: "robustness < 0"
    - id: P-02
      description: "횡가속도 한계"
      robustness: "lateral_acc_threshold - max_over_window(abs(lateral_acc))"
      failure_if: "robustness < 0"
      lateral_acc_threshold_mps2: 4.41         # 2026-10-27 팀원 기준 (junwoo/sim-eval a5242b2 P-02): 0.5 * mu * g, mu = 0.9 가정 (planner 속도계획과 같은 식). basis: design_choice. 이전 3.0 (ISO 11270 / UN R79 참고값, 02 E-01/E-02)
      lateral_acc_formula: {mu: 0.9, g_mps2: 9.81, factor: 0.5}
      role: label_not_failure                  # 2026-10-27: P-02 위반은 recovery_labels.lat_acc_excess 라벨. 차선·충돌 판정과 분리
      primary: baseline_relative               # |a_y_fault - a_y_baseline(같은 경로 위치)| > 4.41
      secondary: total                         # |a_y_fault| > 4.41 (경로 곡률 수요 포함. 팀원 P-02 는 이 전체 값으로 잼)
      note: "G-03 (04) 도 이 값을 쓴다: 공칭 수요 v^2*kappa > 4.41 이면 stress_test 태그 (버리지 않음). 인증 기준 아님"
    - id: P-04
      description: "횡 저크 한계 (라벨)"
      robustness: "lateral_jerk_threshold - max_over_window(abs(movavg_0.5s(d a_y/dt)))"
      lateral_jerk_threshold_mps3: 5.0         # PROVISIONAL. 사용자 제공 참고값 ISO 11270:2014 (E-01)
      role: label_not_failure
      primary: baseline_relative
      secondary: total
    - id: P-03
      description: "충돌 없음"
      monitor: boolean
  evaluation_window:
    start: planned_fault_onset_time            # baseline도 같은 시각부터 자름
    end: simulation_end
    align_baseline_to_fault_run: true
  outcome_categories: [no_trigger, triggered_no_switch, switched_safe,
                       switched_unsafe, simulation_invalid]
  # 2026-10-27: 전환 후 판정 세분화 (정의: 02 vulnerability_patterns.yaml outcome_definitions.recovery_judgment)
  #   outcome_category 5분류는 유지 (역추적용). switched_* 는 recovery_outcome + 라벨로 결정한다.
  after_switch_window_s: 3.0                   # 2026-10-27 팀원 기준 SR5 within_s 3.0 (이전 5.0). PROVISIONAL (= T_hold_s)
  # 우리 recovery v2 판정·GP 타깃이 쓰는 수치는 전부 여기서 읽는다 (engine.monitor.thresholds_from_config; 02 값보다 우선)
  recovery_judgment:
    e_settle_m: 0.3            # = 팀원 SR5 band_m 0.3
    psi_settle_rad: 0.1        # 우리 값 (팀원 SR5 에는 방향각 조건 없음)
    settle_hold_s: 1.0         # = 팀원 SR5 hold_s 1.0
    window_s: 3.0              # = 팀원 SR5 within_s 3.0 (이전 5.0)
    filter_s: 0.5              # 횡가속도·저크 이동평균 (우리 값)
    collision_penalty: -2.0    # lane_recovery_robustness 충돌 값 = 팀원 SR4 collision_value -2.0 (이전 -1.0)
    robustness_clip: [-2.0, 1.0]   # lane_recovery_robustness 자르기 = 팀원 gp_target clip (이전 없음)
  recovery_outcomes: [safe_recovery, recovered_after_departure, unsettled, unrecovered,
                      simulation_invalid, no_switch]
  recovery_labels: [lat_acc_excess, lat_jerk_excess, departed_at_switch, safe_stop]
  category_mapping:
    simulation_invalid: simulation_invalid
    no_trigger: "no_switch (감독기 사유 없음. 감지 못 한 고장 포함 → P-01/P-03은 evaluation_window로 따로 기록)"
    triggered_no_switch: "no_switch (사유는 있으나 LQR로 안 넘어감. av_stack은 같은 틱 전환이라 현재 발생 안 함: supervised_lateral.py:113-117)"
    switched_safe: "final_safe_recovery == true"
    switched_unsafe: "전환했고 final_safe_recovery == false (recovered_after_departure, unsettled, unrecovered, 또는 safe_recovery + 가속도/저크 라벨)"
  infraction_reference: "CARLA Leaderboard 2.1 (02 references E-03): 충돌 → collisions.json / evaluation_events.json, 경로 이탈 → evaluation_events.json"
  simulation_invalid_is_not_safe: true

# 2026-10-27 integration: 팀원 Monitor v2(junwoo/sim-eval a5242b2 safety_spec.yaml requirements)의 SR1/SR2/SR4/SR6
# 수치를 팀원 원본 그대로 둔다 (engine/sr_checks.py). 결과는 run_record 의 sr_* 참고 필드로만 남고 final_safe_recovery 는 바꾸지 않는다.
# SR5 는 위 recovery_judgment (팀원 band/within/hold 와 같은 값) 로 정한 우리 recovery_outcome 에서 파생한다.
sr_checks:
  evaluation_window:         # 팀원 원본: 계획 고장 시각부터 10 s, 5 s 보다 짧으면 invalid (안전 정지·충돌 예외)
    start: planned_fault_onset_time
    length_s: 10.0
    min_length_s: 5.0
    align_baseline_to_fault_run: true   # baseline 도 같은 시각부터 같은 길이 (다르면 V-08)
  SR1:   # 고장이 실제로 MPC 출력을 바꾼 시각 → LQR 전환까지 지연 <= ftti_fraction * FTTI
    ftti_fraction: 0.5
    fixed_fallback_s: 0.5            # no-reaction 런이 없을 때 쓰는 고정 한계
    no_reaction_controller: mpc_unprotected   # FTTI 측정 런 (08 paired_runs.yaml no_reaction_run)
  SR2:   # 전환 순간 조향 명령 변화율
    limit_dps: 60.0
    window_after_switch_s: 0.5
  SR4:   # 차체 사각형(방향각 포함) 기준 차선 여유 + 충돌. G-04: baseline 이 SR4 위반이면 쌍 거절
    footprint: rectangle_with_heading
  SR5:   # 참고: 팀원 원본 값. 판정은 recovery_judgment 가 한다
    band_m: 0.3
    within_s: 3.0
    hold_s: 1.0
    enforce: false
  SR6:   # 조향각 <= 차량 max_steer, 조향 변화율 <= max_rate_dps (평가 창 전체)
    max_rate_dps: 90.0
  validity:
    tick_tolerance: 0.25             # |dt_i - dt| <= 0.25 dt
    onset_tolerance_s: 0.051         # 계획 vs 실제 고장 시작
  gp_score:                          # sr_scores (참고값, GP 학습에는 안 씀): 1 = 여유, 0 = 한계, <0 = 위반
    clip: [-2.0, 1.0]
    collision_value: -2.0
