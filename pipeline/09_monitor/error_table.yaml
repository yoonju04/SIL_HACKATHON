# error_table.yaml — Monitor → Error table (robustness, 결과 5분류)
# 입력: 08 짝 실행 시계열 + safety_spec.yaml
# 출력(피드백 3종):
#   run_record    → 06 GP 재학습 (all_valid_runs, 지표별 타깃)
#   failure_table → 03 Nemotron A 실패 few-shot (verified_failures_top_k)
#   run_record    → 02 hypotheses.yaml tracking (가설 상태 갱신)

meta:
  schema_version: '1.0'
  profile_id: sp-code-aware-mpc-lqr
  status: template_unverified
  linked_files: [safety_spec.yaml]

results_schema:
  run_record: [run_id, scenario_id, seed_scenario_id, round, selector, profile_id,
               source_commit, feature_schema_version, hypothesis_ids, parameters,
               planned_fault_onset, actual_fault_onset, trigger_time, trigger_source,
               trigger_attribution, switch_time,
               switch_count, outcome_category, P01, P02, P03, margin_delta_m,
               switch_state_label, metrics, baseline_metrics, gp_targets,
               gp_mean, gp_std, sim_status, invalid_reason]
  # metrics / baseline_metrics: 02 metric_rules의 모든 지표 + 보조 지표 (정의: 02 outcome_definitions)
  #   계산 불가(예: 전환 없음 → recovery_robustness)는 null. 0으로 대체 금지
  # gp_targets: 06 orientation 적용 후 지표별 z. gp_mean/gp_std: 선택 당시 지표별 예측 {metric: value}
  # margin_delta_m: 보조 지표로 계속 기록 (H-04/H-06 secondary_prediction, H-01 탐색 목표 evaluation)
  metric_names: [recovery_success, recovery_robustness, pre_switch_max_lateral_error_m,
                 switch_count, lateral_error_rmse_m, deadline_miss_rate,
                 mpc_constraint_violation_rate, post_switch_saturation_ratio,
                 command_jump_rad, max_steering_rate_dps, margin_delta_m]
  # trigger_source: 감독기가 전환한 이유 = av_stack supervisor_reason (behavior.jsonl, sim-eval
  #   integration/monitor_logs.py:123-124). 값은 safety_profile.yaml switching.triggers 이름과 같다
  #   (integration/supervised_lateral.py:28-52, 109-112). 전환이 없으면 null.
  trigger_source_values: [solver_failure, missing_steer, nonfinite_output, steer_out_of_range,
                          deadline_miss, stale_output, stale_sequence, tracking_divergence,
                          controller_exception, null]
  # trigger_attribution: 모니터가 사후에 계산 (감독기는 주입 여부를 보지 않음, supervised_lateral.py:20).
  #   fault 설정(mode, fault_start, duration)과 trigger_time을 비교한다. S3/S4 원인 구분용.
  trigger_attribution_values: [no_fault_configured, inside_fault_window, outside_fault_window, no_switch]
  failure_table: [scenario_id, violated_property, originating_evidence_ids,
                  hypothesis_ids, trigger_source, trigger_attribution, environment, fault, onset_event,
                  observed_switch_behavior, robustness, reproduction_count]
  timeseries_store: results/timeseries/
