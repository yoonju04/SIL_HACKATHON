# error_table.yaml — Monitor → Error table (robustness, 결과 5분류)
# 입력: 08 짝 실행 시계열 + safety_spec.yaml
# 출력(피드백 3종):
#   run_record    → 06 GP 재학습 (all_valid_runs, 지표별 타깃)
#   failure_table → 03 Nemotron A 실패 few-shot (verified_failures_top_k)
#   run_record    → 02 hypotheses.yaml tracking (가설 상태 갱신)

meta:
  schema_version: '1.0'
  profile_id: sp-code-aware-mpc-lqr
  status: template_unverified
  linked_files: [safety_spec.yaml]

results_schema:
  run_record: [run_id, scenario_id, seed_scenario_id, round, selector, profile_id,
               source_commit, feature_schema_version, hypothesis_ids, parameters,
               planned_fault_onset, actual_fault_onset, trigger_time, trigger_source,
               trigger_attribution, switch_time,
               switch_count, switch_state, handover_saturation, outcome_category,
               recovery_outcome, recovery_labels, final_safe_recovery, lane_recovery_robustness,
               lat_acc_excess_mps2, P01, P02, P03, margin_delta_m,
               switch_state_label, metrics, baseline_metrics, gp_targets,
               gp_mean, gp_std, sim_status, invalid_reason]
  # metrics / baseline_metrics: 02 metric_rules의 모든 지표 + 보조 지표 (정의: 02 outcome_definitions)
  #   계산 불가(예: 전환 없음 → recovery_robustness)는 null. 0으로 대체 금지
  # gp_targets: 06 orientation 적용 후 지표별 z. gp_mean/gp_std: 선택 당시 지표별 예측 {metric: value}
  # margin_delta_m: 보조 지표로 계속 기록 (H-04/H-06 secondary_prediction, H-01 탐색 목표 evaluation)
  metric_names: [recovery_success, recovery_robustness, pre_switch_max_lateral_error_m,
                 switch_count, lateral_error_rmse_m, deadline_miss_rate,
                 mpc_constraint_violation_rate, post_switch_saturation_ratio,
                 command_jump_rad, max_steering_rate_dps, margin_delta_m,
                 lane_recovery_robustness, lat_acc_excess_mps2, lat_jerk_excess_mps3]
  # 2026-10-27 recovery_judgment (02 outcome_definitions, 수치는 PROVISIONAL):
  #   recovery_outcome: recovery_outcome_values 중 하나 (상호 배타)
  #   recovery_labels: {lat_acc_excess: {primary, secondary}, lat_jerk_excess: {primary, secondary},
  #                     departed_at_switch, safe_stop}  — 다중 라벨, 계산 불가는 null
  #   final_safe_recovery = safe_recovery AND NOT lat_acc_excess.primary AND NOT lat_jerk_excess.primary
  #   GP 타깃 분리: lane_recovery_robustness (차선 여유, 횡가속도 제외) / lat_acc_excess_mps2 (baseline 대비)
  #   recovery_robustness 는 superseded (기록만, 새 런에서는 null 허용)
  #   lat_jerk_excess_mps3: max |j_fault - j_baseline(s)|, 0.5 s 이동평균 후 (라벨 계산용 연속값)
  recovery_outcome_values: [safe_recovery, recovered_after_departure, unsettled, unrecovered,
                            simulation_invalid, no_switch]
  # trigger_source: 감독기가 전환한 이유 = av_stack supervisor_reason (behavior.jsonl, sim-eval
  #   integration/monitor_logs.py:123-124). 값은 safety_profile.yaml switching.triggers 이름과 같다
  #   (integration/supervised_lateral.py:28-52, 109-112). 전환이 없으면 null.
  trigger_source_values: [solver_failure, missing_steer, nonfinite_output, steer_out_of_range,
                          deadline_miss, stale_output, stale_sequence, tracking_divergence,
                          controller_exception, null]
  # trigger_attribution: 모니터가 사후에 계산 (감독기는 주입 여부를 보지 않음, supervised_lateral.py:20).
  #   fault 설정(mode, fault_start, duration)과 trigger_time을 비교한다. S3/S4 원인 구분용.
  trigger_attribution_values: [no_fault_configured, inside_fault_window, outside_fault_window, no_switch]
  # switch_state / handover_saturation: S1 탐색 축 (02 search_objectives/S1_...yaml derived_axes).
  #   전환이 없으면 null. 계산 불가 하위 필드는 null (0 금지). 출처는 sim-eval 9b51151 av_stack 런 출력.
  switch_state_fields:
    e_y_at_switch:   {source: 'agent_controls.jsonl tracking_error @ t = switched_at_s (integration/pdm_agent.py:287)', available: true}
    e_psi_at_switch: {source: 'agent_controls.jsonl heading_error @ t = switched_at_s (pdm_agent.py:288)', available: true}
    e_y_dot_at_switch: {source: 'steps.jsonl vx, vy + heading_error, vx*sin(e_psi)+vy*cos(e_psi) (lqr_controller/reference.py:72)', available: derived}
    e_psi_dot_at_switch: {source: 'yaw_rate - kappa*vx (reference.py:73)', available: false, todo: 'kappa 로깅 (S1 logging_todo L-3)'}
    normalized_switch_error: {source: 'max(|e_y|/1.0, |e_psi|/0.6), supervised_lateral.py:45 임계값', available: true}
    speed_at_switch_mps: {source: 'steps.jsonl vx', available: true}
    kappa_at_switch: {source: null, available: false, todo: L-3}
  handover_saturation_fields:
    window_s: 1.0     # outcome_definitions.post_switch_saturation_ratio와 같은 창
    max_steer_rad: {source: 'agent_config.json geometry.max_steer_rad (integration/tfpp_benchmark.py:111-113)', available: true}
    rate_limit_dps: {source: '구성 상수 PDM 90 (pdm_agent.py:86) / TF++ 60 (supervised_lateral.py:82)', available: 'config, 런 메타에는 없음 (L-2)'}
    angle_saturation_ratio: {source: 'agent_controls.jsonl steer, |steer| >= 1-eps (integration/carla_io.py:29-31)', available: true}
    rate_saturation_ratio: {source: '|Δsteer|*max_steer_rad/0.05 >= rate_limit-eps', available: true}
    time_in_saturation_s: {source: '각도 또는 속도 포화 틱 수 * 0.05', available: true}
    first_lqr_command_unclipped_rad: {source: null, available: false, todo: 'LQROutput steer_feedback+steer_feedforward 기록 (L-1)'}
    predicted_first_lqr_command_ratio: {source: 'first_lqr_command_unclipped_rad / max_steer_rad', available: false, todo: L-1}
    required_steer_rate_ratio: {source: '|u_unclipped(t_sw) - u_applied(t_sw-dt)|/dt / rate_limit', available: false, todo: L-1}
  failure_table: [scenario_id, violated_property, originating_evidence_ids,
                  hypothesis_ids, trigger_source, trigger_attribution, recovery_outcome, recovery_labels,
                  environment, fault, onset_event,
                  observed_switch_behavior, robustness, reproduction_count]
  # failure_table에 넣는 런 (03 Nemotron A few-shot): outcome_category switched_unsafe, 또는 no_switch 이면서
  #   P-01 < 0 / P-03 위반. recovery_outcome 이 unrecovered 인 런을 우선한다 (verified_failures_top_k)
  timeseries_store: results/timeseries/
  baseline_timeseries_cache: "results/baselines/{baseline_cache_key}/ (s, a_y, jerk, lane_offset, heading) — matched-position 비교용" 

# ---- 2026-10-27: pipeline/run.py 출력 ----
# run_records.jsonl (모든 런, RUN_RECORD_FIELDS), failure_table.jsonl (위 failure_table 필드 + recovery_labels)
# 영상 해설은 판정과 분리해 explanations.jsonl 에 따로 저장한다 (monitor_labels_snapshot 은 읽기 전용 사본).
explanations:
  stored_in: explanations.jsonl
  never_modifies: [recovery_outcome, recovery_labels, final_safe_recovery, outcome_category]
  verification: 10_video_explainer/video_explainer.yaml#verification
