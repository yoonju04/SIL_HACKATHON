# scenario_space.yaml — av_stack(PDM-Lite + MPC/LQR 감독기)용 고장 후보 목록: 고장 × 주입 시점 × 환경 범위
# Nemotron B가 여기서 고장 종류·세기를 고르고 시점을 정한다 (환경은 Nemotron A).
# (integration 병합: 팀원 scenario_space.yaml 을 이 이름으로 보관. 우리 scenario_space.yaml 은 팀 템플릿 유지)
# 고장 표와 CARLA 검증 결과는 README.md. 읽기·검증은 engine/fault_catalog.py,
# CARLA 실행 인자 변환은 engine/fault_args.py (to_cli).
# 이전 팀 템플릿(F-01~03 지연 계열)을 대체한다. F-01~07의 뜻은 이 파일 기준이다.
# 위험 고장(F-03~07)은 CARLA 세 경로에서 모두 전환 실패·지연 또는 주행 성능 저하가 확인된 것만 둔다.
# observations = 실제 실행 결과(조건과 횟수 포함), next_question = 다음에 검증할 가설.

meta:
  schema_version: '1.2'
  profile_id: sp-av-stack-pdm-supervised
  status: draft
  observation_sources:
    check_1027: "av_stack/runs/fault_check_1027 (PDM, supervised, seed 17, 커브 약 1 s 전 주입, 경로당 조건 1회; 기준 실행 3개 포함)"
    route_26956: "av_stack/runs/campaign_26956_1025_0202/summary.md (이전 코드, PDM, supervised, 주입 11.5 s, 조건당 1회)"
    town10_live: "av_stack/runs/town10_live_check.log (town10_long, 30 km/h, tools/inject.py 라이브 주입)"
  scenarios_1027:
    A: {route: "Bench2Drive 26956 (Town05, 신호 교차로 우회전)", onset_s: 11.0, turn_speed_mps: 9.8}
    B: {route: "Bench2Drive 28035 (Town01, T자 교차로)", onset_s: 45.8, turn_speed_mps: 5.9}
    C: {route: "town10_long (Town10HD, --green-lights)", onset_s: 52.4, turn_speed_mps: 9.3}

# 감독기 동작 (pipeline/08_carla_paired_run/av_stack/integration/supervised_lateral.py)
supervisor:
  period_s: 0.05
  instant_checks: [solver_failure, missing_steer, nonfinite_output, steer_out_of_range,
                   deadline_miss, stale_output, stale_sequence, steer_rate_exceeded]
  stale_output_tolerance_s: 0.1                 # |t - stamp| > 0.1 s면 전환
  steer_out_of_range: "최대각 초과만 검사 (정확히 최대각은 통과)"
  steer_out_of_range_en: "only a command beyond the maximum angle fails (exactly the maximum passes)"
  # integration4: run_benchmark --supervisor tight(기본) | legacy (SUPERVISOR_PROFILES)
  steer_rate_exceeded: {max_dps: 90.0, note: "MPC 출력 조향 속도. MPC는 스스로 60 °/s로 제한하므로 90 °/s 초과는 고장 (legacy: 검사 없음)",
                        note_en: "rate of the MPC output steering command. The MPC limits itself to 60 deg/s, so > 90 deg/s is a fault (legacy: no check)"}
  tracking_divergence: {e_y_m: 0.6, e_psi_rad: 0.35, hold_s: 0.15,
                        legacy: {e_y_m: 1.0, e_psi_rad: 0.6, hold_s: 0.25},
                        note: "MPC가 보고한 오차를 씀. 정상 샘플 하나면 타이머 리셋. 고장 없는 기준 실행 61개 최대 |e_y| 0.46 m, |e_psi| 0.23 rad",
                        note_en: "uses the error the MPC reports; one healthy sample resets the 0.15 s timer. 61 fault-free baselines: max |e_y| 0.46 m, |e_psi| 0.23 rad"}
  latched: true                                 # LQR로 넘어가면 MPC로 돌아오지 않음

environment:
  max_speed_kmh:       {range: [10, 40], unit: km/h, cli: --max-speed}
  # integration3: run_benchmark.py --tire-friction-scale (CARLA WheelPhysicsControl.tire_friction x scale, 4바퀴 모두,
  # get_physics_control/apply_physics_control). 1.0 = CARLA 기본 타이어. baseline도 같은 마찰로 돈다 (08 match key).
  # 09 P-02 한계 0.5*mu*g 는 mu = 0.9 * scale 로 같이 줄어든다 (engine/monitor.py). CARLA tire_friction 은 물리적 mu와
  # 같지 않으므로 scale 은 상대값으로만 해석한다.
  tire_friction_scale: {range: [0.3, 1.0], default: 1.0, cli: --tire-friction-scale, cli_format: '%.2f'}

fault_timing:
  onset_event: {values: [straight, curve_entry, curve_apex, curve_exit]}
  offset_s:    {range: [-1.0, 1.0], unit: s}

# integration3 #8b: 이 경로에서는 이 시작 이벤트를 쓰지 않음 (이벤트 뒤 6 s 미만 = 5 s 평가창(V-03) + 시작 오프셋 최대 +1 s.
#   V-03으로 항상 버려짐). result_6: 15개 중 7개가 baseline V-03로 버려졌고 그중 6개가 아래 무조건 목록, 1개(28035
#   curve_entry 35 km/h)가 속도 조건 항목에 걸린다. 실측 = result_1~6 고장 없는 baseline (경로 끝 - 이벤트 시각):
#     28035 (10개, 15~40 km/h): straight 45.3~53.3 s, curve_entry 4.2~10.9, curve_apex 3.1~8.1, curve_exit 2.1~6.0
#     28154 (12개, 10~40 km/h): straight 24.6~58.6, curve_entry 4.6~14.6, curve_apex 1.1~11.4, curve_exit 0.0 (커브 중 경로 끝)
#     28048 (4개, 15~25 km/h):  straight 1.9~3.3, curve_entry 7.8~13.4, curve_apex 5.7~9.6, curve_exit 4.4~7.6
#   무조건 제외 = 실측 baseline 의 80% 이상이 6 s 미만인 조합. 28048 curve_exit 은 4개 중 2개만 6 s 미만(15 km/h 7.6 s 두 번,
#   20 km/h 5.8, 25 km/h 4.4)이라 사용자 제안(무조건 제외) 대신 20 km/h 이상만 제외.
#   {event, min_kmh}: 그 속도 이상에서만 제외 (그 아래에서는 6 s 이상 남음). 28035 curve_entry: 25 km/h 6.4 s, 30 km/h 5.5 s;
#   28154 curve_entry: 20 km/h 7.4 s, 25 km/h 4.7 s; 28048 curve_apex: 20 km/h 7.9 s, 25 km/h 5.7 s. 측정 안 한 더 빠른 속도는
#   더 짧아지는 방향. 판정은 여전히 baseline 이 생긴 뒤 gate(BUG-028)/baseline_gate 가 정확히 한다; 이 표는 baseline 이
#   없는 첫 조합에서 CARLA 시간을 아끼는 사전 필터다. (engine/scenarios.py allowed_onset_events, validate_against_space)
# integration3 #8b: onset events this route never grades (< 6 s left after the event = 5 s V-03 window + max +1 s
#   offset). Measured on the fault-free baselines of result_1..6 (route end - event time). {event, min_kmh} = excluded
#   from that speed up only. A pre-filter for (route, speed) pairs whose baseline has not run yet.
route_onset_exclusions:
  bench2drive:28035: [curve_apex, curve_exit, {event: curve_entry, min_kmh: 30}]
  bench2drive:28154: [curve_apex, curve_exit, {event: curve_entry, min_kmh: 25}]
  bench2drive:28048: [straight, {event: curve_exit, min_kmh: 20}, {event: curve_apex, min_kmh: 25}]

# group: control = 대조군, risk = 위험 고장
# injector_mode = run_benchmark.py --mpc-fault 값 (integration/fault_injection.py)
faults:
  - id: F-01
    name: solver_fail
    group: control
    role: 명시적 계산 실패
    description: "MPC가 '답을 못 구했다'고 보고"
    description_en: "MPC reports that it found no solution (ok = False)"
    check: "실패 상태를 받으면 정상 전환하는가"
    check_en: "Does the supervisor switch correctly when it receives the failure status?"
    layer: mpc_output
    injector_mode: solver_fail
    implemented: true
    # BUG-024: no duration axis. The supervisor latches LQR on the first bad sample, so 1 s or 3 s gives the same
    # run (result_4 R00-0013 / R00-0019). Without a duration the fault stays on until the route ends (to_cli).
    # integration3 #3: 지속시간 축이 없으니(BUG-024) 결과를 바꾸는 건 "LQR이 넘겨받는 순간의 차량 상태"다.
    # handover_axes = 이 고장을 샘플링할 때 쓰는 좁힌 범위 (engine/scenarios.py space_filling, Nemotron A 스키마).
    # 검증(G-02)은 위의 전체 범위 그대로. result_2~5: 25 km/h 통과, 35 km/h 커브 진입 실패가 유일한 경계 단서.
    handover_axes:
      onset_event:         {values: [curve_entry, curve_apex]}
      offset_s:            {range: [-0.5, 0.5], unit: s, note: "커브 진입·정점 주변을 촘촘히 (전체 -1~1 s의 절반 폭)",
                            note_en: "dense around curve entry / apex (half of the full -1..1 s width)"}
      max_speed_kmh:       {range: [25, 40], unit: km/h}
      tire_friction_scale: {range: [0.3, 1.0]}
      todo: "측풍·질량·속도 외란 노브는 run_benchmark.py 에 아직 없다 (CARLA 물리 API 확인 전). 새 물리를 만들지 않고, 생기면 여기에 추가"
      todo_en: "cross-wind, mass and speed disturbance knobs do not exist in run_benchmark.py yet; no new physics is invented"
    params: {}
    observations:
      - {source: route_26956, result: "0.0 s에 전환 (solver_failure), 최대 e_y 0.625 m, 차선 이탈 0%, 점수 100", runs: 1}
      - {source: town10_live, result: "0.0 s에 전환 (30 km/h, 60 km/h 각 1회)", runs: 2}
    next_question: "커브 정점·고속에서 전환 직후 조향 점프와 회복 거리는 얼마인가"
    next_question_en: "At the curve apex / high speed, how large is the steering jump right after the switch and how long is the recovery?"

  - id: F-02
    name: stale
    group: control
    role: 오래된 메시지
    description: "직전 메시지를 값·시각·번호까지 통째로 반복 (freshness 단서가 남는 경우)"
    description_en: "Repeats the previous message whole: value, time stamp and sequence number (the freshness cue remains)"
    check: "출력 중단을 제때 감지하는가"
    check_en: "Is the output stall detected in time?"
    layer: mpc_output
    injector_mode: stale
    implemented: true
    # BUG-024: no duration axis. The supervisor latches LQR on the first bad sample, so 1 s or 3 s gives the same
    # run (result_4 R00-0013 / R00-0019). Without a duration the fault stays on until the route ends (to_cli).
    # integration3 #3: 지속시간 축이 없으니(BUG-024) 결과를 바꾸는 건 "LQR이 넘겨받는 순간의 차량 상태"다.
    # handover_axes = 이 고장을 샘플링할 때 쓰는 좁힌 범위 (engine/scenarios.py space_filling, Nemotron A 스키마).
    # 검증(G-02)은 위의 전체 범위 그대로. result_2~5: 25 km/h 통과, 35 km/h 커브 진입 실패가 유일한 경계 단서.
    handover_axes:
      onset_event:         {values: [curve_entry, curve_apex]}
      offset_s:            {range: [-0.5, 0.5], unit: s, note: "커브 진입·정점 주변을 촘촘히 (전체 -1~1 s의 절반 폭)",
                            note_en: "dense around curve entry / apex (half of the full -1..1 s width)"}
      max_speed_kmh:       {range: [25, 40], unit: km/h}
      tire_friction_scale: {range: [0.3, 1.0]}
      todo: "측풍·질량·속도 외란 노브는 run_benchmark.py 에 아직 없다 (CARLA 물리 API 확인 전). 새 물리를 만들지 않고, 생기면 여기에 추가"
      todo_en: "cross-wind, mass and speed disturbance knobs do not exist in run_benchmark.py yet; no new physics is invented"
    params: {}
    observations:
      - {source: route_26956, result: "0.0 s에 전환 (stale_sequence)", runs: 1}
    next_question: "값만 고정하고 시각·번호를 갱신하면 감지되는가 (확장 E-01)"
    next_question_en: "If only the value is frozen while stamp and sequence are refreshed, is it still detected? (extension E-01)"

  - id: F-03
    name: output_delay
    group: risk
    role: 시간 문제
    description: "k틱 전에 계산한 명령을 현재 시각·번호로 내보냄 (처리 지연. 옛 시각이면 시작 순간 번호 검사에 걸림)"
    description_en: "Sends the command computed k ticks ago under the current stamp and sequence (processing latency; an old stamp would be caught by the sequence check at onset)"
    check: "늦은 명령 처리와 전환 지연"
    check_en: "Handling of late commands and the switch delay"
    layer: mpc_output
    injector_mode: output_delay
    implemented: true
    params:
      delay_ticks: {values: [1, 2, 3, 4, 6]}
    observations:
      - {source: check_1027, result: "A, 4틱: 2.05 s 뒤 전환, 최대 편차 4.86 m (기준 0.46), 전환 0.65 s 뒤 차량 충돌, 점수 18.1", runs: 1}
      - {source: check_1027, result: "B, 4틱: 3.65 s 뒤 전환, 최대 편차 1.47 m (기준 0.34), 차체가 차선 넘음", runs: 1}
      - {source: check_1027, result: "C, 4틱: 전환 못 함, 최대 편차 0.59 m (기준 0.22), 차선 안", runs: 1}
    next_question: "몇 틱부터 전환이 늦어지고 충돌로 이어지는가. 속도와 곡률에 따라 경계가 어떻게 바뀌는가"
    next_question_en: "From how many ticks does the switch become late and lead to a collision? How does that boundary move with speed and curvature?"

  - id: F-04
    name: bias
    group: risk
    role: 은밀한 값 오염
    description: "조향값에 일정한 각도를 계속 더함"
    description_en: "Adds a constant angle to the steering command"
    check: "감지 누락과 전환 후 회복"
    check_en: "Missed detection and recovery after the switch"
    layer: mpc_output
    injector_mode: bias
    implemented: true
    params:
      magnitude_rad: {range: [0.02, 0.10], unit: rad}
    observations:
      - {source: check_1027, result: "A, 0.05 rad: 전환 못 함, 최대 편차 0.93 m (기준 0.46), 차체가 차선을 0.10 m 넘음", runs: 1}
      - {source: check_1027, result: "B, 0.05 rad: 전환 못 함, 최대 편차 0.90 m (기준 0.34)", runs: 1}
      - {source: check_1027, result: "C, 0.05 rad: 전환 못 함, 최대 편차 0.76 m (기준 0.22)", runs: 1}
      - {source: town10_live, result: "0.05 rad: 전환 못 함", runs: 1}
      - {source: route_26956, result: "0.02 rad 전환 못 함, 0.05 rad 4.7 s 뒤 전환, 0.10 rad 2.3 s 뒤 전환 (이전 코드)", runs: 3}
    next_question: "감지 경계 크기는 어디인가. 주입 방향(커브 안쪽/바깥쪽)에 따라 달라지는가"
    next_question_en: "Where is the magnitude at which detection starts? Does it depend on the direction (inside / outside of the curve)?"

  - id: F-05
    name: drift
    group: risk
    role: 점진적 값 오염
    description: "조향 오차가 시간이 갈수록 커짐"
    description_en: "The steering error grows with time since the fault start"
    check: "악화 속도에 따른 감지·전환 지연"
    check_en: "Detection / switch delay as a function of the growth rate"
    layer: mpc_output
    injector_mode: drift
    implemented: true
    params:
      rate_rad_s: {range: [0.005, 0.05], unit: rad/s}
    observations:
      - {source: check_1027, result: "A, 0.03 rad/s: 3.45 s 뒤 전환, 최대 편차 1.20 m (기준 0.46), 차체가 차선을 0.37 m 넘음", runs: 1}
      - {source: check_1027, result: "B, 0.03 rad/s: 3.05 s 뒤 전환, 최대 편차 1.10 m (기준 0.34)", runs: 1}
      - {source: check_1027, result: "C, 0.03 rad/s: 3.75 s 뒤 전환, 최대 편차 1.18 m (기준 0.22), 차체가 차선을 0.35 m 넘음", runs: 1}
      - {source: route_26956, result: "0.05 rad/s 2.6 s 뒤 전환. 0.02 rad/s는 deadline_miss로 전환 (drift 감지 아님, 이전 코드)", runs: 2}
    next_question: "악화 속도와 전환 지연은 어떤 관계인가"
    next_question_en: "How does the drift rate relate to the switch delay?"

  - id: F-06
    name: saturate
    group: risk
    role: 급격한 이상
    description: "조향을 최대각의 magnitude 배로 고정 (1.0 = 정확히 최대각, 범위 검사 통과). ramp_s 동안 MPC 명령에서 선형으로 올라감"
    description_en: "Holds steering at magnitude x the maximum angle (1.0 = exactly the limit, which passes the range check); with ramp_s the command rises linearly from the MPC command"
    check: "급격히 악화된 상태에서의 인계·회복"
    check_en: "Handover and recovery from a sharply degraded state"
    layer: mpc_output
    injector_mode: saturate
    implemented: true
    # integration3 (DriveFI, Jha et al. 2019, arXiv 1907.01051: 고장 세기·시점을 연속값으로 두고 경계를 찾음):
    # magnitude / ramp_s 추가. magnitude 1.0 + ramp_s 0.0 = 예전 동작 (CLI 기본값, 기존 결과와 호환).
    # run_benchmark.py --saturate-level / --fault-ramp (engine/fault_args.py to_cli).
    params:
      duration_s: {range: [0.1, 1.0], unit: s}
      side:       {values: [positive, negative], note: "MPC 조향 부호", note_en: "sign of the held steering command"}
      magnitude:  {range: [0.2, 1.0], unit: fraction_of_max_steer, default: 1.0, cli: --saturate-level,
                   note: "최대 조향각 대비 비율. 1.0 미만이면 범위 검사는 원래도 통과하고, 추적 오차로만 감지됨",
                   note_en: "fraction of the maximum steering angle; values up to 1.0 pass the range check, so detection is only via tracking error"}
      ramp_s:     {range: [0.0, 0.3], unit: s, default: 0.0, cli: --fault-ramp,
                   note: "0 = 한 틱에 점프 (실제 액추에이터로는 불가능, SR6 위반이 구조적으로 생김). >0 = 선형 상승",
                   note_en: "0 = jump within one tick (impossible for a real actuator, violates SR6 by construction); >0 = linear rise"}
    observations:
      - {source: check_1027, result: "A, 0.5 s (+): 0.75 s 뒤 전환, 최대 편차 7.06 m, 차선 이탈, 점수 51.1", runs: 1}
      - {source: check_1027, result: "B, 0.5 s (+): 0.85 s 뒤 전환, 최대 편차 8.26 m, 차선 이탈, 점수 74.8", runs: 1}
      - {source: check_1027, result: "C, 0.5 s (+): 0.70 s 뒤 전환, 최대 편차 8.84 m, 차선 이탈, 신호등 충돌", runs: 1}
