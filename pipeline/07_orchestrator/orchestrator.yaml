# orchestrator.yaml — Orchestrator 선택 (LCB + 다양성 + 무작위 25%)
# 입력: 06 지표별 GP 평균·불확실성(z). 출력: 실행 배치 → 08 CARLA 짝 실행

meta:
  schema_version: '1.0'
  profile_id: sp-code-aware-mpc-lqr
  status: template_unverified
  updated: '2026-10-27 실행 엔진(run.py) 연결: objective_acquisition, fault_pool, candidate_pool 추가'

cold_start:
  gp_enabled: false
  # integration3 #8c: 고정값 24(근거 없는 예시) 대신 규칙. null 이면 rule, 숫자면 그 값 (run.py --cold-start 가 둘 다 덮어씀).
  #   rule: max(min_train_runs_for_acquisition (06 surrogate.yaml, 8 = GP 획득이 켜지는 런 수),
  #             per_fault_type x 라운드 0 에 돌 수 있는 고장 종류 수) 를 max_runs 로 자름.
  #   라운드 0 고장 종류 = 위험 고장 + min(대조군 고장, control_faults_per_round_max) = 5 + 1 = 6 → max(8, 2x6) = 12.
  #   근거 (mock 전용, SYNTHETIC 시뮬레이터 + stub LLM 이라 경향만): /workspace/coldstart_sens (results.csv = #8 이전,
  #   results_after.csv = #8 이후). #8 이전, 예산 48 고정, cold 4/8/12/24 x seed 10개: balanced GP 정확도 평균
  #   0.84/0.83/0.83/0.81 (seed 간 범위 ~0.1 이 크기 간 차이 0.02 보다 큼), 전체 캠페인 경계 양쪽 관측 10/10 모두.
  #   라운드 0 이 경계 양쪽을 본 seed 5/7/9/8, GP 획득 시작 라운드 2/1~2/1/1, 24 는 실제로 20 런만 돌고(G-02/V-03 탈락)
  #   예산 절반을 GP 없이 씀. 12 = 8 (GP 시작) 이상이면서 라운드 0 에 고장 종류를 2번씩 볼 수 있는 가장 작은 값.
  # integration3 #8c: rule instead of the unfounded fixed 24 (null = rule, a number = that number, --cold-start overrides):
  #   max(min_train_runs_for_acquisition, per_fault_type x fault types round 0 can run) capped at max_runs.
  #   Evidence is mock-only (synthetic simulator, tendencies only): /workspace/coldstart_sens.
  total_runs: null
  rule: {per_fault_type: 2, max_runs: 12}
  mix: {nemotron_a: 0.5, space_filling: 0.5}

acquisition:
  name: lower_confidence_bound
  formula: "mean_z[m] - beta * std_z[m]"
  metric_of_candidate: "m = 02 hypotheses[h].prediction.metric for h in candidate.hypothesis_ids"
  multi_hypothesis: min_over_cited_hypotheses   # 여러 가설을 인용하면 가장 위험한 쪽
  inactive_metric: skip_lcb_use_space_filling   # 해당 지표 GP가 아직 없으면 무작위 몫으로
  selection: minimize
  beta_schedule: {start: 2.0, end: 0.5, decay: linear_over_rounds}   # 예시
  batch_size: 12
  batch_composition: {lcb: 0.75, random_space_filling: 0.25, nemotron_a: 0.3}
  # integration3 #4: nemotron_a = 라운드마다 배치의 이 비율(올림)을 Nemotron A 후보에 먼저 배정 (run.py Loop.nemotron_share).
  #   나머지 자리를 lcb/random 비율로 나눈다. 범위 끝값을 근거 없이 쓴 후보(range_extreme_unjustified)는 뒤로 밀림.
  #   (result_2~5: A 후보가 매 라운드 15개 나왔지만 GP·랜덤이 배치를 다 차지해 cold start 1개만 실행됨)
  diversity:
    min_normalized_distance: 0.1                # 예시
    max_per_seed: 2
  hypothesis_coverage:
    ensure_each_testing_hypothesis_gets_control_runs: true

budget:
  sim_seconds_per_run_measured: null            # 1~3일 차에 측정
  max_simulations: 72                           # PROVISIONAL: cold start 12 (cold_start.rule) + 5 라운드 x 12. 런 시간 측정 후 조정
                                                # (integration3 #8c: 예전 주석 "24 + 4 x 12" 는 고정 24 기준)
  wall_time_budget_s: null
  stop_if:
    - budget_exhausted
    - "no new unique failure condition for 3 rounds"
    - "max std_z over active metrics < threshold"

# ---- 2026-10-27: run.py 가 읽는 값 ----
active_objectives: [S1]                         # S2/S3는 objective 파일이 아직 template
fault_pool: [F-01, F-02, F-03, F-04, F-05, F-06, F-07]   # scenario_space faults 중 implemented: true
control_faults_per_round_max: 1                 # BUG-025: 대조군(F-01 solver_fail, F-02 stale)은 라운드당 최대 1개
objective_acquisition:
  S1:
    metric: recovery_success                    # 02 vulnerability_patterns metric_rules.recovery_success
    gp_target: lane_recovery_robustness         # absolute_post_switch, scale 0.1 m, 0 = 차선 경계
    # integration3: level_set = Gotovos et al. IJCAI 2013 (LSE, https://www.ijcai.org/Proceedings/13/Papers/202.pdf).
    #   score = max( (beta*std_z - |mean_z - h_z|)/std(y_train) - switch_penalty*(1 - P(switch)),
    #                beta*sd_f - |mu_f|  [전환 분류 GP 잠재함수, P=0.5 경계] )  → engine/surrogate.py boundary_score
    #   "전환 여부가 불확실하거나 OR 복구가 경계 근처"인 점을 고른다. 예전 방식은 acquisition: straddle (legacy).
    acquisition: level_set                      # level_set (기본) | straddle (legacy: run.switch_aware_score) | lower_confidence_bound
    level: 0.0                                  # h: lane_recovery_robustness 경계 (무차원: 여유/(차선폭/2-반폭), m 아님. 0 = 차체가 차선 경계). z로 바꿔 씀 (integration3 #7 주석 정정)
    switch_penalty: 1.0                         # 전환 가능성이 낮은 곳의 복구 점수 감점 (정규화 단위)
    beta: 1.96                                  # PROVISIONAL
  default:
    acquisition: lower_confidence_bound         # 위 acquisition 섹션 (최악 사례 탐색 목적)
candidate_pool:
  space_filling_per_round: 40                   # 라운드마다 GP가 고를 무작위 후보 수 (예시)
  # Nemotron A per_round: 03 nemotron_a.yaml, 섭동 per_seed: 04 feasibility_expansion.yaml
