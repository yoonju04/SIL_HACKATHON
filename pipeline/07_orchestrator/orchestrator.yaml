# orchestrator.yaml — Orchestrator 선택 (LCB + 다양성 + 무작위 25%)
# 입력: 06 지표별 GP 평균·불확실성(z). 출력: 실행 배치 → 08 CARLA 짝 실행

meta:
  schema_version: '1.0'
  profile_id: sp-code-aware-mpc-lqr
  status: template_unverified
  updated: '2026-10-27 실행 엔진(pipeline/run.py) 연결: objective_acquisition, fault_pool, candidate_pool 추가'

cold_start:
  gp_enabled: false
  total_runs: 24                                # 예시
  mix: {nemotron_a: 0.5, space_filling: 0.5}

acquisition:
  name: lower_confidence_bound
  formula: "mean_z[m] - beta * std_z[m]"
  metric_of_candidate: "m = 02 hypotheses[h].prediction.metric for h in candidate.hypothesis_ids"
  multi_hypothesis: min_over_cited_hypotheses   # 여러 가설을 인용하면 가장 위험한 쪽
  inactive_metric: skip_lcb_use_space_filling   # 해당 지표 GP가 아직 없으면 무작위 몫으로
  selection: minimize
  beta_schedule: {start: 2.0, end: 0.5, decay: linear_over_rounds}   # 예시
  batch_size: 12
  batch_composition: {lcb: 0.75, random_space_filling: 0.25}
  diversity:
    min_normalized_distance: 0.1                # 예시
    max_per_seed: 2
  hypothesis_coverage:
    ensure_each_testing_hypothesis_gets_control_runs: true

budget:
  sim_seconds_per_run_measured: null            # 1~3일 차에 측정
  max_simulations: 72                           # PROVISIONAL: cold start 24 + 4 라운드 x 12. 런 시간 측정 후 조정
  wall_time_budget_s: null
  stop_if:
    - budget_exhausted
    - "no new unique failure condition for 3 rounds"
    - "max std_z over active metrics < threshold"

# ---- 2026-10-27: pipeline/run.py 가 읽는 값 ----
active_objectives: [S1]                         # S2/S3는 objective 파일이 아직 template
fault_pool: [F-01, F-02, F-03, F-04, F-05, F-06, F-07]   # scenario_space faults 중 implemented: true
objective_acquisition:
  S1:
    metric: recovery_success                    # 02 vulnerability_patterns metric_rules.recovery_success
    gp_target: lane_recovery_robustness         # absolute_post_switch, scale 0.1 m, 0 = 차선 경계
    acquisition: straddle                       # beta*std_z - |mean_z| 최대화 (Bryan et al. 2005, 경계 추정용)
    beta: 1.96                                  # PROVISIONAL
  default:
    acquisition: lower_confidence_bound         # 위 acquisition 섹션 (최악 사례 탐색 목적)
candidate_pool:
  space_filling_per_round: 40                   # 라운드마다 GP가 고를 무작위 후보 수 (예시)
  # Nemotron A per_round: 03 nemotron_a.yaml, 섭동 per_seed: 04 feasibility_expansion.yaml
