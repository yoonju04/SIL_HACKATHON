# A_switch_analysis_layer.yaml — 공통 분석 기록 (모든 S 런에 붙인다)
# 2026-10-27 v0.3: H-04(전환 순간 상태)와 H-05(포화)는 S1의 핵심 탐색 축으로 이동했다
#   (S1_operating_condition_recovery_boundary.yaml derived_axes). A에는 모든 런 공통 기록만 남는다.
# 현재 파이프라인은 이 파일을 읽지 않는다. 근거 코드: junwoo/sim-eval 9b51151 (AV = pipeline/08_carla_paired_run/av_stack/)

meta:
  schema: analysis_layer
  schema_version: '0.3'
  status: design_draft_not_consumed_by_pipeline
  supersedes: []

id: A
legacy_ids: []
moved_to_S1: [H-04, H-05]
title: Common Per-Run Switch Record

purpose: 'S1~S4 어느 목표의 런이든 같은 형식으로 전환 정보를 남겨 목표 간 비교·회귀(R)에 쓴다'

record_every_run:
  trigger_source: 'supervisor_reason (behavior.jsonl, monitor_logs.py:123-124)'
  trigger_attribution: '09 error_table 정의 (모니터 사후 계산)'
  switch_time: 'switched_at_s (supervised_lateral.py:146, record() :140-144)'
  switch_count: 'switch_count (record())'
  safe_stop: 'stop_required (record()) / summary.json supervisor.safe_stop (monitor_logs.py:137-138)'
  switch_state: 'S1 derived_axes.switch_state와 같은 정의로 계산 (S1이 아닌 런도 기록)'
  saturation: 'S1 derived_axes.actuator_limits 중 loggable_now 항목'

recoverability_label:
  from: H-04
  status: on_hold
  note: 'P_matrix / level_c / reach_table 없음. LQR이 속도별 gain이라 오라클도 속도별로 계산해야 함'

limitations: {see: _common.yaml#limitations}
