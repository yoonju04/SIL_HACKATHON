  - recovery_robustness에 필요한 제약 한계값 채우기 (requires_profile_values)
  - recovery_success의 인증서 없는 판정 기준 확정 (T_settle_s, 인증서 의존 여부)
  - switch_trigger 고장·시점 고정 여부 결정
  - 경계 추정용 획득 함수 정의 및 07 orchestrator 연동
  - 이 스키마를 읽는 로더 작성 (현재 파이프라인은 미사용)
  - regression_verification 별도 스키마 설계
