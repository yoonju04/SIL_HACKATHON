# S4_stress_plus_fault.yaml — S4 (선택): S3 상황 × S2 고장 (search_objective v0.2)
# 현재 파이프라인은 이 파일을 읽지 않는다.

meta:
  schema: search_objective
  schema_version: '0.2'
  status: optional_design_draft
  kind: optional

id: S4
legacy_ids: []
source_objectives: [S2, S3]
title: MPC-Stressed Context plus Injected Fault

objective:
  question_ko: 'MPC가 이미 힘든 상황(S3)에서 고장(S2)이 겹치면 감지·복구가 더 나빠지는가?'

preconditions:
  - 'S3에서 자연 전환 영역이 먼저 파악돼야 함 (자연 전환이 고장보다 먼저 울리면 S4 런이 아님)'
  - 'S3의 stress knob(질량·마찰 등) runner 인자 구현'

search_dimensions: {from_S3: [route_id, max_speed_kmh, planner], from_S2: [onset_event, offset_s, detection_delaying_fault]}

switch_trigger:
  mechanism: injected_fault_in_stressed_context
  attribution_rule: >
    trigger_source와 trigger_attribution(09 error_table)로 원인을 나눈다.
    고장 창 밖에서 울린 전환(outside_fault_window)은 S3 결과로 분리한다.
    고장 창 안이라도 deadline_miss나 tracking_divergence는 자연 원인과 섞일 수 있음을 표시한다.

evaluation: [detection_delay_s, pre_switch_max_lateral_error_m, lane_recovery_robustness, lat_acc_excess_mps2, recovery_outcome, recovery_labels, recovery_success, trigger_source, trigger_attribution]   # recovery_*: _common.yaml recovery_judgment

risks:
  - '원인 혼동: 감독기는 주입 여부를 보지 않음 (supervised_lateral.py:20). 원인 구분은 사후 분석에서만 가능'
  - '같은 S2 고장의 무스트레스 런(S2)과 짝지어 비교해야 효과를 말할 수 있음'

limitations: {see: _common.yaml#limitations}
