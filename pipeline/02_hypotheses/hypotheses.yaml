# hypotheses.yaml — 코드마다 자동 생성되는 결과물 (손으로 편집하지 않음)
# vulnerability_patterns.yaml(틀) + safety_profile.yaml(값) → 이 파일
# 아래 값은 "코드 A: 고정 gain LQR, 설계 속도 15 m/s, 복귀 로직 있음"을 가정한 형식 예시다.
# 실제 코드가 들어오면 생성기가 이 파일 전체를 다시 쓴다.
# fault_types는 04 scenario_space.yaml(av_stack 고장 목록 F-01~07) 번호를 쓴다. 이전 템플릿 번호에서 바꿈:
#   템플릿 F-01 solver 실행 지연      -> F-03 output_delay (늦은 명령)
#   템플릿 F-02 solver 상태 위조(실패) -> F-01 solver_fail
#   템플릿 F-03 solver 지연 진동      -> F-07 intermittent_bias (같은 고장 아님: 가장 가까운 "켜졌다 꺼졌다" 고장,
#                                      감독기 타이머 리셋 경계를 노림. 지연 진동은 주입기에 없음)

meta:
  schema_version: '1.0'
  generated_by: hypothesis_generator       # 패턴 적용 + Nemotron 추가 제안
  profile_id: sp-code-aware-mpc-lqr
  source_commit: null                       # 생성에 쓴 제어기 코드 커밋
  catalog_version: '1.0'                    # vulnerability_patterns.yaml 버전
  generated_at: null
  frozen_at_commit: null                    # 판정 런 시작 전 이 파일을 커밋하고 기록
  status: example_only

# 실행 중 가설 내용은 바뀌지 않고 status만 바뀐다.
status_values:
  proposed: "생성됨, 아직 판정 런 없음"
  blocked: "needs 중 null이 있어 검증 불가"
  testing: "판정 런이 첫 checkpoint 미만"
  supported: "decision_rule.support_if 충족"
  refuted: "decision_rule.refute_if 충족"
  inconclusive: "최대 checkpoint 도달, 어느 쪽도 충족 못 함"

# 카탈로그 패턴별 적용 결과 (생성되지 않은 패턴도 사유와 함께 기록)
pattern_application:
  - {pattern_id: P-OFF-DESIGN,     applies: true,  reason: "gain_type == fixed (O-001)"}
  - {pattern_id: P-DELAYED-SWITCH, applies: true,  reason: "failure_detection_period_ms = 20 (O-007)"}
  - {pattern_id: P-CHATTERING,     applies: true,  reason: "return_to_mpc.enabled == true (O-010)"}

hypotheses:
  - id: H-01
    from_pattern: P-OFF-DESIGN
    provenance: pattern_instantiation
    based_on: [O-001, O-002, O-003]          # gain_type, design_speed_mps, design_curvature_per_m
    filled_values:
      design_speed_mps: 15.0
      design_curvature_per_m: 0.0
    condition:
      speed_offset_mps: "abs(speed_mps - 15.0) > 5.0"
      curvature_offset: "road_curvature_per_m - 0.0 > 0.01"
      fault_types: [F-03, F-01]
      onset_event: [curve_entry, curve_apex]
    control:
      speed_offset_mps: "abs(speed_mps - 15.0) <= 2.0"
      curvature_offset: "road_curvature_per_m - 0.0 <= 0.005"
      fault_types: [F-03, F-01]
      onset_event: [curve_entry, curve_apex]
    prediction: {metric: margin_delta_m, direction: negative}
    decision_rule: default
    status: proposed

  - id: H-02
    from_pattern: P-DELAYED-SWITCH
    provenance: pattern_instantiation
    based_on: [O-005, O-006, O-007, O-008]
    filled_values:
      configured_time_limit_ms: 20
      failure_detection_period_ms: 20
      command_during_detection_delay: hold_last
    condition:
      expected_switch_after_curve_entry: "onset_time + 0.02 > curve_entry_time"
      fault_types: [F-03]
    control:
      expected_switch_after_curve_entry: "onset_time + 0.02 <= curve_entry_time"
      fault_types: [F-03]
    prediction: {metric: margin_delta_m, direction: negative}
    secondary_prediction:
      - {metric: pre_switch_max_lateral_error_m, direction: positive}
    decision_rule: {inherit: default, from_pattern: P-DELAYED-SWITCH}
    status: proposed

  - id: H-03
    from_pattern: P-CHATTERING
    provenance: pattern_instantiation
    based_on: [O-005, O-010, O-011, O-012, O-013]
    filled_values:
      configured_time_limit_ms: 20
      minimum_dwell_s: 0.2
      steering_blending: none
    condition:
      fault_types: [F-07]
      fault_params: {off_s: "near(0.2, 0.05)"}   # minimum_dwell_s 0.2 근처
    control:
      fault_types: [F-03]
      fault_params: {delay_ticks: 1}
    prediction: {metric: switch_count, direction: positive}
    secondary_prediction:
      - {metric: max_steering_rate_dps, direction: positive}
      - {metric: margin_delta_m, direction: negative}
    decision_rule: {inherit: default, from_pattern: P-CHATTERING}
    status: proposed

  # Nemotron이 카탈로그 밖에서 제안하고 자동 검사(llm_proposed_hypothesis_gate)를 통과한 가설
  # - id: H-04
  #   from_pattern: null
  #   provenance: llm_inference
  #   mechanism: "..."
  #   based_on: [O-0xx]
  #   condition: {...}
  #   control: {...}
  #   prediction: {metric: ..., direction: ...}
  #   decision_rule: default
  #   status: proposed

# 검사에서 탈락한 Nemotron 제안 (재현성·디버깅용)
rejected_proposals: []

# Orchestrator가 실행 중 채움
tracking:
  - {id: H-01, runs_condition: 0, runs_control: 0, d_estimate: null, ci: null, status_history: []}
  - {id: H-02, runs_condition: 0, runs_control: 0, d_estimate: null, ci: null, status_history: []}
  - {id: H-03, runs_condition: 0, runs_control: 0, d_estimate: null, ci: null, status_history: []}
