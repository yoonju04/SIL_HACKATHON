references:
  S-01:
    cite: Bak, Johnson, Caccamo, Sha. Real-Time Reachability for Verified Simplex Design. IEEE RTSS 2014.
    used_for:
    - admissible vs recoverable 상태 구분
    - 늦은 전환의 복구 불가
    - LMI 타원체의 보수성
    - 온라인 도달 가능성으로 전환 영역 확장
  S-02:
    cite: Sha. Using Simplicity to Control Complexity. IEEE Software, 2001.
    used_for:
    - Simplex 구조(고성능 주 제어기 + 검증된 안전 제어기 + 결정 모듈)
  S-03:
    cite: Landolfi et al. Hardware-in-the-Loop Validation of an Adaptive MPC on a Connected and Automated Vehicle.
      IJACSP 37(6), 2023.
    used_for:
    - 예측 모델(single-track) ≠ 플랜트 모델(4륜+Dugoff) 구조
    - robustness/sensitivity 시험 분리
    - 질량·마찰·풍속 변수
    - MAXE/RMSE 지표
    caution: 악조건에서도 MPC는 추종 성능을 유지했음. 마찰 감소가 MPC 실패를 유발한다는 근거로 쓰면 안 됨.
  S-04:
    cite: Mahmood & Szabolcsi. Safety-Constrained NMPC for Autonomous Vehicle Lane Keeping and Lane Change under
      Disturbances. 2026.
    used_for:
    - 도로 경계·조향·가속도 제약 위반을 실패 기준으로 사용
    - 단계적 외란 실험(LK→LC→속도외란→복합외란)
    - solver 시간 vs deadline 측정
    caution: deadline 초과 25/800(N=20, 100 ms 주기)은 해당 설정의 값. 코드 A의 주기·solver에 그대로 적용 불가. Phase 4는 더 보수적 설정이라 난이도만
      바꾼 비교가 아님.
  S-05:
    cite: Mahmood & Szabolcsi (2026), Safety-Constrained NMPC for Autonomous Vehicle Lane Keeping and Lane Change
      under Disturbances
    used_for:
    - 조향·차선·횡가속도 제약 모니터링과 위반 비율 비교
    caution: 고곡률/고속에서 반드시 위반한다는 증거가 아님
outcome_definitions:
  admissible_constraints:
    lateral_error: abs(e_y) <= lane_half_width_m - vehicle_half_width_m
    steering_angle: abs(delta) <= delta_max_rad
    steering_rate: abs(delta_dot) <= delta_rate_max_rps
    lateral_accel: abs(a_y) <= a_y_max_mps2
  recovery_success:
    definition: 'After switch: no constraints violated during T_hold and enters certified invariant region by T_settle
      if such certificate is available; otherwise outcome unavailable.'
    T_hold_s: 5.0
    T_settle_s: null
  margin_delta_m: 정상(무고장) 기준 런 대비 최소 횡방향 여유 차이 (기존 정의 유지)
  post_switch_saturation_ratio: t_sw 이후 1 s 동안 조향각 또는 조향속도 포화 스텝 비율
  command_jump_rad: abs(u_LQR(t_sw) - u_MPC(t_sw - dt))
  switch_occurred: 보조 지표. 전환 실패(전환 자체가 없음)는 recovery_success = false 로 처리
  recovery_robustness: min over [switch_time, switch_time + T_hold_s] of min_i(margin_i / limit_i) over admissible_constraints.
    < 0 means a constraint was violated. Undefined if no switch.
  pre_switch_max_lateral_error_m: max abs(e_y) over [actual_fault_onset, switch_time]
  lateral_error_rmse_m: RMS of e_y over the safety_spec evaluation window
  deadline_miss_rate: solver calls exceeding configured_time_limit_ms / solver calls, evaluation window
  mpc_constraint_violation_rate: control steps with any MPC constraint violated / control steps, evaluation window
  switch_count: number of MPC->LQR switches in the evaluation window
recoverability_oracle_spec:
  state:
  - e_y
  - e_y_dot
  - e_psi
  - e_psi_dot
  design_model_ref: O-020
  labels:
    R_LMI: Certified interior only if a valid certificate exists
    R_REACH_ESTIMATED: Simulation-estimated recovery candidate; not formally verified
    NOT_CERTIFIED: Recovery not certified; NOT proof of irrecoverability
  T_reach_s: 1.0
  reach_method: sampled_simulation_not_formal_verification
  speed_grid_mps:
  - 10
  - 15
  - 20
  - 25
  artifacts:
    P_matrix: null
    level_c: null
    reach_table: null
  manipulation_check: '각 런의 실제 전환 시점 상태를 라벨링해 의도한 arm과 다르면 해당 런은 판정에서 제외하고 mismatch_runs에 기록

    '
metric_rules:
  recovery_success:
    unit: binary
    effect: risk_difference
    support_direction: negative
    minimum_effect: 0.05
    ci_level: 0.99
    gp:
      target: recovery_robustness
      form: absolute_post_switch
      scale: 0.1
      scale_status: example_only
      note: binary recovery_success is for hypothesis decisions only; the GP regresses its continuous robustness
  pre_switch_max_lateral_error_m:
    unit: m
    effect: mean_difference
    support_direction: positive
    minimum_effect: 0.1
    ci_level: 0.99
    gp:
      target: pre_switch_max_lateral_error_m
      form: paired_delta_if_fault_else_absolute
      scale: 0.1
  switch_count:
    unit: count
    effect: mean_difference
    support_direction: positive
    minimum_effect: 1.0
    ci_level: 0.99
    gp:
      target: switch_count
      form: paired_delta_if_fault_else_absolute
      scale: 1.0
  lateral_error_rmse_m:
    unit: m
    effect: mean_difference
    support_direction: positive
    minimum_effect: 0.1
    ci_level: 0.99
    gp:
      target: lateral_error_rmse_m
      form: paired_delta_if_fault_else_absolute
      scale: 0.1
  deadline_miss_rate:
    unit: fraction
    effect: risk_difference
    support_direction: positive
    minimum_effect: 0.05
    ci_level: 0.99
    gp:
      target: deadline_miss_rate
      form: paired_delta_if_fault_else_absolute
      scale: 0.05
  mpc_constraint_violation_rate:
    unit: fraction
    effect: risk_difference
    support_direction: positive
    minimum_effect: 0.05
    ci_level: 0.99
    gp:
      target: mpc_constraint_violation_rate
      form: paired_delta_if_fault_else_absolute
      scale: 0.05
decision_protocol:
  runs_source: dedicated_random_in_region
  gp_search_runs_used_for_decision: false
  effect: condition - control, per metric_rules[metric].effect
  interval:
    method: bootstrap
    level: 0.99
    resamples: 5000
  support_if:
    negative: ci_upper < -minimum_effect
    positive: ci_lower > minimum_effect
    non_inferior: ci_lower > -minimum_margin
  refute_if:
    negative: ci_lower > -minimum_effect
    positive: ci_upper < minimum_effect
    non_inferior: ci_upper < -minimum_margin
  else: inconclusive
  checkpoints_per_arm:
  - 10
  - 20
  - 30
  exclude_outcomes:
  - simulation_invalid
  exclude_runs:
  - recoverability_manipulation_check_mismatch
  - metric_unavailable
status_values:
  proposed: 생성됨, 아직 판정 런 없음
  blocked: needs/템플릿/차원/오라클 중 비어 있어 검증 불가
  testing: 판정 런이 첫 checkpoint 미만
  supported: decision_protocol.support_if 충족
  refuted: decision_protocol.refute_if 충족
  inconclusive: 최대 checkpoint 도달, 어느 쪽도 충족 못 함
