- id: H-08
  from_pattern: P-MPC-MODEL-MISMATCH-H-08
  phase: before_switch
  provenance: pattern_instantiation
  claim: MPC 예측 모델(kinematic bicycle, 고정 mu)과 CARLA 차량 거동의 차이가 커지는 조건에서, 정상 조건보다 횡방향 추종 오차와 조향 입력 부담이 증가한다.
  based_on: []
  filled_values:
    controllers.mpc.implementation.prediction_model: null
    controllers.mpc.implementation.model_parameters_fixed: null
  condition:
    fault_types: []
    road_curvature_per_m: '> 0.01'
    speed_mps: '> 20'
    vehicle_mass_scale: 1.3
    tire_friction_scale: 0.6
  control:
    fault_types: []
    road_curvature_per_m: '> 0.01'
    speed_mps: '> 20'
    vehicle_mass_scale: 1.0
    tire_friction_scale: 0.8
  scenario_guidance:
    odd_dimensions:
    - speed_mps
    - road_curvature_per_m
    - tire_friction_scale
    - vehicle_mass_scale
    fault_dimensions: []
    candidate_constraints:
    - keep_controller_parameters_fixed
    selection_objective: seek_boundary_or_uncertainty
    physical_validity_checks:
    - finite_values
    - within_scenario_space
    - physically_feasible
    sensitivity_arms:
    - tire_friction_only
    - vehicle_mass_only
  prediction:
    metric: lateral_error_rmse_m
    direction: positive
  secondary_prediction:
  - metric: steering_effort_rms_rad
    direction: positive
  - metric: mpc_switch_trigger_rate
    direction: positive
  evidence:
  - source: S-03
    role: method_borrowed
    supports: 예측 모델 ≠ 플랜트 모델 구조, 질량 1,050→1,371 kg·마찰 0.8→0.6 변화폭, robustness와 sensitivity 시험 분리, RMSE·MAXE 지표
    does_not_claim: S-03에서 Adaptive MPC는 악조건에서도 추종을 유지함(횡방향 RMSE 1.7/3.7 cm). 이 가설은 고정 모델 MPC에 대한 새 검증 가설이며 S-03
      결론의 재현이 아님
  decision_rule:
    unit: m
    effect: mean_difference
    support_direction: positive
    minimum_effect: 0.1
    ci_level: 0.99
    gp:
      target: lateral_error_rmse_m
      form: paired_delta_if_fault_else_absolute
      scale: 0.1
  status: blocked
  design_notes: 풍속은 CARLA에서 직접 구현이 어려워 제외. mass_scale 1.3은 S-03의 1,371/1,050 ≈ 1.31에서 가져옴
  blocked_reason:
  - 'Missing applies_if fields: controllers.mpc.implementation.prediction_model, controllers.mpc.implementation.model_parameters_fixed'
  - 'missing profile values: controllers.mpc.implementation.prediction_model, controllers.mpc.implementation.model_parameters_fixed'
