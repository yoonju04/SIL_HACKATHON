# paired_runs.yaml — CARLA 짝 실행: baseline(캐시) vs fault, Nebius 병렬
# 입력: 07 선택 배치. 출력: 시계열 → 09 Monitor

meta:
  schema_version: '1.0'
  profile_id: sp-code-aware-mpc-lqr
  status: template_unverified

carla:
  version: '0.9.15'                          # sim-eval av_stack README / requirements (carla==0.9.15)
  map_name: per_route                        # Bench2Drive 경로 XML이 town을 정함
  # routes_arg/route_id_arg 는 run_benchmark.py --routes / --route-id 로 그대로 넘어간다 (run_benchmark.py:21-24)
  # 경로 선택 근거: /workspace/sim scenarios_1027 (A 26956 Town05, B 28035 Town01, C town10_long --green-lights)
  routes:
    - route_id: bench2drive:26956
      routes_arg: bench2drive
      route_id_arg: 26956
      town: Town05
      note: 'scenarios_1027 A'
      # 2026-10-28 끔: 25~35 km/h baseline이 ~13 s에 충돌(BUG-004 잔여). real_gen_1028에서 G-04 거절 5/11 (BUG-011)
      enabled: false
    - route_id: bench2drive:28035
      routes_arg: bench2drive
      route_id_arg: 28035
      town: Town01
      note: 'scenarios_1027 B'
      enabled: true
    - route_id: town10_long
      routes_arg: town10_long
      route_id_arg: null
      town: Town10HD
      extra_args: [--green-lights]
      note: 'scenarios_1027 C'
      enabled: true
    # 2026-10-28 추가 (BUG-011). 검증 = PC CARLA 0.9.15, 30 km/h, fault 없음 baseline 1회 + baseline_gate.
    # 다른 속도에서는 아직 확인 안 함. 결과는 BUG-012 수정(정지 구간 제외) 후 기준
    - route_id: bench2drive:24206
      routes_arg: bench2drive
      route_id_arg: 24206
      town: Town03
      note: 'ParkingCrossingPedestrian. 30km/h 검증: 36.4 s 완주, curve_entry/apex/exit/straight 모두 gate 통과 (곡선 6.2~11.3 s, 출발 직후라 저속)'
      enabled: true
    - route_id: bench2drive:28048
      routes_arg: bench2drive
      route_id_arg: 28048
      town: Town02
      note: 'T_Junction. 30km/h 검증: 38.5 s 완주, curve_entry만 통과. straight는 BUG-012 수정 후 경로 끝(36.8 s)이라 V-03, curve_apex/exit도 V-03'
      enabled: true
    - route_id: bench2drive:28154
      routes_arg: bench2drive
      route_id_arg: 28154
      town: Town10HD
      note: 'T_Junction 155 m. 30km/h 검증: 31.3 s 완주, straight만 통과, 곡선 3개는 V-03(곡선이 끝에 있음)'
      enabled: true
  ego_vehicle_blueprint: null
  fixed_delta_seconds: 0.05                  # 1/frame_rate 20 Hz (sim-eval tfpp_benchmark/agent_config dt 0.05) = 제어 주기 50 ms
  synchronous_mode: true

paired_runs:
  modes: [no_fault_baseline, fault_injected]
  match: [map, route_id, initial_state, seed, weather, traffic, speed_mps,
          tire_friction_scale, vehicle_mass_scale, maneuver, velocity_disturbance,
          steering_disturbance, max_speed_kmh, planner]
  # 2026-10-27 추가: vehicle_mass_scale·maneuver·velocity/steering_disturbance (S3 stress 축, 다르면 다른 baseline),
  #   max_speed_kmh·planner (sim-eval run_benchmark.py:25, 33. planner마다 LQR 설정이 다름: safety_profile O-016).
  #   지금 runner에 없는 축(질량·마찰·maneuver·외란)은 값이 null로 들어가며, 구현되면 그대로 키가 된다.
  search_target:
    per_metric: true                         # 06 surrogate.yaml target_forms 참조
    defined_in: 02_hypotheses/vulnerability_patterns.yaml#metric_rules.*.gp
  no_fault_candidates: single_run            # fault_types가 빈 후보(H-08/H-10/H-11)는 짝 없이 1회
  record_all_metrics_every_run: true         # 지표 GP끼리 데이터를 공유하도록
  failure_report_uses: absolute_robustness     # 실패 판정은 절대값(P-01..03)
  baseline_cache:
    enabled: true
    key: match                                 # 같은 key면 baseline 1회만 실행
  detector_cannot_see_injected_fault: true
  # 런마다 09 run_record로 넘길 감독기 기록 (sim-eval av_stack 로그 기준)
  supervisor_log_fields:
    trigger_source: 'behavior.jsonl supervisor_reason / control log supervisor_reason (integration/monitor_logs.py:123-124, supervised_lateral.py:140-144)'
    switch_time: 'switched_at_s'
    switch_count: 'switch_count'
    fault_config: 'fault_mode, fault_magnitude, fault_injected (integration/pdm_agent.py:284-296)'

execution:
  backend: local_carla                         # CARLA 서버 1대 (Windows start_carla_stable.ps1). Nebius 병렬은 future work
  parallel_workers: 1                          # PROVISIONAL: 동시 실행 안 함 (포트/TM 충돌)

# ---- 2026-10-27: engine/carla_runner.py 가 읽는 값 ----
runner:
  entrypoint: pipeline/08_carla_paired_run/av_stack/run_benchmark.py   # sim-eval 병합 후 위치 (없으면 AV_STACK_ROOT/SIM_EVAL_ROOT)
  python_exe: null                             # null이면 av_stack/.venv-tfpp/Scripts/python.exe → bin/python → 환경변수 AV_STACK_PYTHON
  planner: pdm                                 # scenario_space_av_stack.yaml 관측 조건 (사용자 확인 필요)
  controller: supervised
  record_front: true                           # front.mp4 + front_frames.jsonl → 10 video explainer
  chase_view: false                            # true면 view.mp4도 기록 (창 필요). 기본 --no-view
  stop_after_fault_s: 15.0                     # PROVISIONAL: SR 평가 창 10 s (회복 창 3 s) + 여유. --stop-after-fault
  no_reaction_run:                             # 2026-10-27 integration: SR1 FTTI 측정용 (engine/sr_checks.py)
    controller: mpc_unprotected                # 같은 고장, 감독기 없음 (run_benchmark.py --controller)
    mock: true                                 # mock 에서는 합성 런이라 비용 0
    real: false                                # CARLA 런이 후보마다 1개 더 → 기본 off (run.py --no-reaction-runs on)
  speed_step_kmh: 5                            # PROVISIONAL: baseline 캐시 재사용을 위해 속도를 5 km/h 격자로
  friction_step: 0.1                           # integration3: tire_friction_scale 도 0.1 격자로 (마찰마다 baseline 이 따로 필요)
  seed: 17                                     # run_benchmark.py 기본값
  host: localhost                              # 환경변수 CARLA_HOST
  port: 2000                                   # 환경변수 CARLA_PORT
  traffic_manager_port: 8050
  rpc_timeout_s: 120
  wall_timeout_s: 1800                         # 런 1개 subprocess 제한
event_detection:                               # baseline 곡률(yaw_rate/vx)로 onset_event 시각을 찾는다. PROVISIONAL
  kappa_on: 0.0167                             # 1/60 m^-1
  kappa_off: 0.00333                           # 1/300 m^-1
  min_curve_s: 1.0
  min_straight_s: 3.0
  t_min: 5.0                                   # 출발 직후 제외
  # BUG-012: 정지 구간이 '직선'으로 잡히던 문제. 실제로 움직이는 틱만 씀 (v_ref = 이동 속도 90번째 백분위)
  min_speed_mps: 2.0                           # 절대 최소 속도
  straight_speed_frac: 0.6                     # 직선: vx >= max(2.0, 0.6 v_ref). 처음 이 속도에 닿기 전(출발 구간)은 제외
  curve_speed_frac: 0.5                        # 곡선: vx >= max(2.0, 0.5 v_ref) (저속에서 yaw_rate/vx 곡률이 흔들림)
